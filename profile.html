<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#020617">
    <title>Profile - KMCA</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="user-icon-180.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="KMCA">
    <link rel="icon" href="favicon.ico">
    
    <style>
        /* ============ CSS VARIABLES ============ */
        :root {
            --primary: #d4af37;
            --primary-dark: #b8962e;
            --primary-light: #f0d060;
            --bg-dark: #020617;
            --bg-card: #0f172a;
            --bg-input: #1e293b;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --error: #ef4444;
            --success: #10b981;
            --warning: #f59e0b;
            --info: #3b82f6;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --shadow: 0 4px 20px rgba(0,0,0,0.2);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="light"] {
            --bg-dark: #f8fafc;
            --bg-card: #ffffff;
            --bg-input: #f1f5f9;
            --text-light: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            overflow-x: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-dark);
            color: var(--text-light);
            line-height: 1.6;
            min-height: 100vh;
            padding-bottom: 40px;
            transition: background 0.3s, color 0.3s;
        }

        /* ============ HEADER ============ */
        .page-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 100;
            box-shadow: var(--shadow);
        }

        .back-btn, .edit-btn {
            width: 42px;
            height: 42px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            color: var(--text-light);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: var(--transition);
        }

        .back-btn:hover {
            background: var(--primary);
            color: var(--bg-dark);
            transform: translateX(-2px);
        }

        .edit-btn:hover {
            background: var(--primary);
            color: var(--bg-dark);
            transform: scale(1.05);
        }

        .page-title {
            font-size: 18px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .page-title i {
            color: var(--primary);
        }

        /* ============ MAIN CONTENT ============ */
        .main-content {
            max-width: 600px;
            margin: 0 auto;
            padding: 80px 16px 20px;
        }

        /* ============ LOADING ============ */
        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 80px 20px;
            gap: 16px;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--bg-input);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            color: var(--text-muted);
            font-size: 14px;
        }

        /* ============ PROFILE CARD ============ */
        .profile-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            overflow: hidden;
            animation: slideUp 0.5s ease-out;
            margin-bottom: 20px;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ============ PROFILE HEADER ============ */
        .profile-header {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.2), rgba(212, 175, 55, 0.05));
            padding: 32px 20px 24px;
            text-align: center;
            position: relative;
        }

        .profile-avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 44px;
            font-weight: 800;
            color: var(--bg-dark);
            margin: 0 auto 16px;
            border: 4px solid var(--bg-card);
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.4);
            overflow: hidden;
            letter-spacing: 2px;
            position: relative;
        }

        .profile-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-name {
            font-size: 24px;
            font-weight: 800;
            color: var(--text-light);
            margin-bottom: 4px;
            letter-spacing: -0.5px;
        }

        .profile-subtitle {
            font-size: 14px;
            color: var(--text-muted);
        }

        .profile-joined {
            display: inline-block;
            margin-top: 12px;
            padding: 4px 12px;
            background: var(--bg-input);
            border-radius: 12px;
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 600;
        }

        /* ============ PROFILE BODY ============ */
        .profile-body {
            padding: 24px;
        }

        /* ============ INFO LIST ============ */
        .info-list {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .info-row {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 16px;
            background: var(--bg-input);
            border-radius: var(--radius-md);
            transition: var(--transition);
        }

        .info-row:hover {
            transform: translateX(4px);
        }

        .info-row-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(212, 175, 55, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
            color: var(--primary);
            flex-shrink: 0;
        }

        .info-row-content {
            flex: 1;
            min-width: 0;
        }

        .info-row-label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .info-row-value {
            font-size: 15px;
            color: var(--text-light);
            font-weight: 600;
            word-break: break-word;
        }

        .info-row-value.empty {
            color: var(--text-muted);
            font-style: italic;
            font-weight: 400;
        }

        /* ============ STATS GRID ============ */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }

        .stat-card {
            background: var(--bg-input);
            border-radius: var(--radius-md);
            padding: 16px 8px;
            text-align: center;
            transition: var(--transition);
        }

        .stat-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow);
        }

        .stat-value {
            font-size: 22px;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 4px;
        }

        .stat-label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        /* ============ EDIT MODAL ============ */
        .edit-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 5000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            backdrop-filter: blur(8px);
        }

        .edit-modal.active {
            display: flex;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .edit-modal-content {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 28px 24px;
            animation: scaleIn 0.3s ease-out;
        }

        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .edit-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .edit-modal-header h3 {
            font-size: 20px;
            font-weight: 800;
            color: var(--text-light);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .edit-modal-header h3 i {
            color: var(--primary);
        }

        .edit-modal-close {
            width: 36px;
            height: 36px;
            background: var(--bg-input);
            border: none;
            border-radius: 50%;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }

        .edit-modal-close:hover {
            background: var(--error);
            color: white;
            transform: rotate(90deg);
        }

        /* ============ FORM ============ */
        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group label i {
            color: var(--primary);
        }

        .form-group label .optional {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 400;
            margin-left: auto;
        }

        .form-group input {
            width: 100%;
            background: var(--bg-input);
            border: 2px solid var(--border);
            border-radius: var(--radius-md);
            padding: 14px 16px;
            color: var(--text-light);
            font-size: 15px;
            transition: var(--transition);
            outline: none;
            font-family: inherit;
        }

        .form-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.15);
        }

        .form-group input::placeholder {
            color: #64748b;
        }

        .form-error {
            font-size: 12px;
            color: var(--error);
            margin-top: 6px;
            display: none;
            align-items: center;
            gap: 6px;
        }

        .form-error.show {
            display: flex;
        }

        /* ============ PROFILE PICTURE UPLOAD ============ */
        .profile-upload-section {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px;
            background: var(--bg-input);
            border: 2px dashed var(--border);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: var(--transition);
            margin-bottom: 18px;
        }

        .profile-upload-section:hover {
            border-color: var(--primary);
            background: rgba(212, 175, 55, 0.05);
        }

        .profile-upload-preview {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            font-weight: 800;
            color: var(--bg-dark);
            overflow: hidden;
            flex-shrink: 0;
            letter-spacing: 1px;
        }

        .profile-upload-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-upload-info {
            flex: 1;
        }

        .profile-upload-info strong {
            display: block;
            font-size: 14px;
            color: var(--text-light);
            margin-bottom: 2px;
        }

        .profile-upload-info span {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* ============ BUTTONS ============ */
        .btn-primary {
            width: 100%;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: var(--bg-dark);
            border: none;
            border-radius: var(--radius-md);
            padding: 15px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-family: inherit;
            margin-top: 8px;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(212, 175, 55, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        /* ============ LOADING OVERLAY ============ */
        .loading-overlay {
            position: fixed;
            inset: 0;
            background: rgba(2, 6, 23, 0.95);
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 20px;
            backdrop-filter: blur(10px);
        }

        .loading-overlay.active {
            display: flex;
        }

        .loading-overlay .loading-spinner {
            width: 50px;
            height: 50px;
        }

        .loading-overlay-text {
            color: white;
            font-size: 14px;
            font-weight: 600;
        }

        /* ============ TOAST ============ */
        .kmca-toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: var(--success);
            color: white;
            padding: 14px 24px;
            border-radius: var(--radius-md);
            font-size: 14px;
            font-weight: 600;
            z-index: 99999;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 10px;
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            max-width: 90%;
        }

        /* ============ EMPTY STATE ============ */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .empty-state i {
            font-size: 64px;
            color: var(--border);
            margin-bottom: 16px;
        }

        /* ============ RESPONSIVE ============ */
        @media (max-width: 480px) {
            .main-content {
                padding: 76px 12px 20px;
            }
            
            .profile-avatar {
                width: 90px;
                height: 90px;
                font-size: 36px;
            }
            
            .profile-name {
                font-size: 20px;
            }
            
            .profile-body {
                padding: 20px;
            }
            
            .edit-modal-content {
                padding: 24px 20px;
            }
        }
    </style>
</head>
<body>
    
    <!-- ============ HEADER ============ -->
    <header class="page-header">
        <button class="back-btn" id="backBtn">
            <i class="fas fa-arrow-left"></i>
        </button>
        <div class="page-title">
            <i class="fas fa-user"></i>
            Profile
        </div>
        <button class="edit-btn" id="editBtn">
            <i class="fas fa-edit"></i>
        </button>
    </header>
    
    <!-- ============ MAIN CONTENT ============ -->
    <main class="main-content" id="mainContent">
        <div class="loading-container">
            <div class="loading-spinner"></div>
            <div class="loading-text">Inapakia...</div>
        </div>
    </main>
    
    <!-- ============ EDIT MODAL ============ -->
    <div class="edit-modal" id="editModal">
        <div class="edit-modal-content">
            <div class="edit-modal-header">
                <h3>
                    <i class="fas fa-user-edit"></i>
                    Edit Profile
                </h3>
                <button class="edit-modal-close" id="editModalClose">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            
            <form id="editProfileForm" onsubmit="return false;">
                <!-- Profile Picture -->
                <div class="profile-upload-section" id="profileUploadSection">
                    <div class="profile-upload-preview" id="profileUploadPreview">
                        <i class="fas fa-camera"></i>
                    </div>
                    <div class="profile-upload-info">
                        <strong>Badilisha Picha</strong>
                        <span>JPG, PNG (max 5MB)</span>
                    </div>
                </div>
                <input type="file" id="profilePictureInput" accept="image/*" style="display: none;">
                
                <!-- Jina -->
                <div class="form-group">
                    <label for="editJina">
                        <i class="fas fa-user"></i>
                        Jina *
                    </label>
                    <input type="text" id="editJina" placeholder="Jina lako kamili" required>
                    <div class="form-error" id="editJinaError">
                        <i class="fas fa-exclamation-circle"></i>
                        <span></span>
                    </div>
                </div>
                
                <!-- Phone -->
                <div class="form-group">
                    <label for="editPhone">
                        <i class="fas fa-phone"></i>
                        Namba ya Simu
                        <span class="optional">Optional</span>
                    </label>
                    <input type="tel" id="editPhone" placeholder="0712345678" maxlength="10" inputmode="numeric">
                    <div class="form-error" id="editPhoneError">
                        <i class="fas fa-exclamation-circle"></i>
                        <span></span>
                    </div>
                </div>
                
                <!-- Parokia -->
                <div class="form-group">
                    <label for="editParokia">
                        <i class="fas fa-church"></i>
                        Parokia
                        <span class="optional">Optional</span>
                    </label>
                    <input type="text" id="editParokia" placeholder="Jina la Parokia">
                </div>
                
                <!-- Jimbo -->
                <div class="form-group">
                    <label for="editJimbo">
                        <i class="fas fa-map-marker-alt"></i>
                        Jimbo
                        <span class="optional">Optional</span>
                    </label>
                    <input type="text" id="editJimbo" placeholder="Jimbo lako">
                </div>
                
                <!-- Submit -->
                <button type="submit" class="btn-primary" id="saveProfileBtn">
                    <i class="fas fa-save"></i>
                    Hifadhi Mabadiliko
                </button>
            </form>
        </div>
    </div>
    
    <!-- ============ LOADING OVERLAY ============ -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
        <div class="loading-overlay-text" id="loadingOverlayText">Inapakia...</div>
    </div>
    
    <!-- ============ SCRIPTS ============ -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="user-auth.js"></script>
    <script src="dark-mode.js"></script>
    
    <script>
        // ============================================
        // PROFILE PAGE - profile.html
        // ============================================
        
        let settings = {};
        let profileUser = null;
        let stats = { likes: 0, comments: 0, shares: 0 };
        let selectedProfileFile = null;
        
        document.addEventListener('DOMContentLoaded', async function() {
            console.log('Profile page - Initializing');
            
            // Check user
            profileUser = getCurrentUser();
            if (!profileUser) {
                window.location.href = 'index.html';
                return;
            }
            
            // Load settings
            settings = await loadSettings();
            
            // Load stats
            await loadStats();
            
            // Render profile
            renderProfile();
            
            // Setup events
            setupEvents();
        });
        
        // ============ LOAD SETTINGS ============
        async function loadSettings() {
            try {
                const { data } = await supabaseClient
                    .from('app_settings')
                    .select('setting_key, setting_value');
                
                const settingsObj = {};
                (data || []).forEach(s => {
                    settingsObj[s.setting_key] = s.setting_value;
                });
                
                return settingsObj;
            } catch (e) {
                return {};
            }
        }
        
        // ============ LOAD STATS ============
        async function loadStats() {
            try {
                // Likes zilizotolewa na user
                const { count: likeCount } = await supabaseClient
                    .from('content_likes')
                    .select('*', { count: 'exact', head: true })
                    .eq('user_id', profileUser.id);
                
                stats.likes = likeCount || 0;
                
                // Comments za user
                const { count: commentCount } = await supabaseClient
                    .from('comments')
                    .select('*', { count: 'exact', head: true })
                    .eq('user_id', profileUser.id);
                
                stats.comments = commentCount || 0;
                
                // Shares za user
                const { count: shareCount } = await supabaseClient
                    .from('content_shares')
                    .select('*', { count: 'exact', head: true })
                    .eq('user_id', profileUser.id);
                
                stats.shares = shareCount || 0;
                
            } catch (e) {
                console.log('Load stats error:', e);
            }
        }
        
        // ============ RENDER PROFILE ============
        function renderProfile() {
            const container = document.getElementById('mainContent');
            
            const initials = generateInitials(profileUser.jina);
            const hasProfilePicture = profileUser.profile_picture && 
                                     profileUser.profile_picture !== 'null' && 
                                     profileUser.profile_picture !== 'undefined' &&
                                     profileUser.profile_picture.trim() !== '';
            
            const avatarHtml = hasProfilePicture
                ? `<img src="${profileUser.profile_picture}" alt="${profileUser.jina}" onerror="this.parentElement.innerHTML='${initials}'">`
                : initials;
            
            const joinedDate = profileUser.created_at 
                ? new Date(profileUser.created_at).toLocaleDateString('sw-TZ', { day: 'numeric', month: 'long', year: 'numeric' })
                : '';
            
            const html = `
                <div class="profile-card">
                    <div class="profile-header">
                        <div class="profile-avatar">${avatarHtml}</div>
                        <h1 class="profile-name">${profileUser.jina}</h1>
                        <p class="profile-subtitle">${profileUser.parokia || 'Mwanakwaya'}</p>
                        ${joinedDate ? `<div class="profile-joined"><i class="fas fa-calendar"></i> Alijiunga ${joinedDate}</div>` : ''}
                    </div>
                    
                    <div class="profile-body">
                        <div class="info-list">
                            ${renderInfoRow('fa-phone', 'Namba ya Simu', profileUser.phone)}
                            ${renderInfoRow('fa-church', 'Parokia', profileUser.parokia)}
                            ${renderInfoRow('fa-map-marker-alt', 'Jimbo', profileUser.jimbo)}
                        </div>
                        
                        <div class="stats-grid">
                            <div class="stat-card">
                                <div class="stat-value">${stats.likes}</div>
                                <div class="stat-label">Likes</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-value">${stats.comments}</div>
                                <div class="stat-label">Comments</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-value">${stats.shares}</div>
                                <div class="stat-label">Shares</div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            
            container.innerHTML = html;
        }
        
        // ============ RENDER INFO ROW ============
        function renderInfoRow(icon, label, value) {
            const isEmpty = !value || value === 'null' || value === 'undefined' || value.trim() === '';
            
            return `
                <div class="info-row">
                    <div class="info-row-icon">
                        <i class="fas ${icon}"></i>
                    </div>
                    <div class="info-row-content">
                        <div class="info-row-label">${label}</div>
                        <div class="info-row-value ${isEmpty ? 'empty' : ''}">
                            ${isEmpty ? 'Haipo' : value}
                        </div>
                    </div>
                </div>
            `;
        }
        
        // ============ SETUP EVENTS ============
        function setupEvents() {
            // Back button
            document.getElementById('backBtn').addEventListener('click', function() {
                window.history.back();
            });
            
            // Edit button
            document.getElementById('editBtn').addEventListener('click', function() {
                openEditModal();
            });
            
            // Close edit modal
            document.getElementById('editModalClose').addEventListener('click', function() {
                closeEditModal();
            });
            
            // Close on outside click
            document.getElementById('editModal').addEventListener('click', function(e) {
                if (e.target === this) closeEditModal();
            });
            
            // Profile picture upload
            document.getElementById('profileUploadSection').addEventListener('click', function() {
                document.getElementById('profilePictureInput').click();
            });
            
            document.getElementById('profilePictureInput').addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (!file) return;
                
                // Validate size
                if (file.size > 5 * 1024 * 1024) {
                    showToast('Picha ni kubwa mno. Max 5MB', 'error');
                    return;
                }
                
                // Validate type
                if (!file.type.startsWith('image/')) {
                    showToast('Chagua picha pekee', 'error');
                    return;
                }
                
                selectedProfileFile = file;
                
                // Preview
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('profileUploadPreview').innerHTML = 
                        `<img src="${e.target.result}" alt="Preview">`;
                };
                reader.readAsDataURL(file);
            });
            
            // Phone input (only numbers)
            document.getElementById('editPhone').addEventListener('input', function() {
                this.value = this.value.replace(/\D/g, '');
                if (this.value.length > 10) {
                    this.value = this.value.substring(0, 10);
                }
                this.classList.remove('error');
                document.getElementById('editPhoneError').classList.remove('show');
            });
            
            // Jina input
            document.getElementById('editJina').addEventListener('input', function() {
                this.classList.remove('error');
                document.getElementById('editJinaError').classList.remove('show');
            });
            
            // Save profile
            document.getElementById('editProfileForm').addEventListener('submit', async function(e) {
                e.preventDefault();
                await saveProfile();
            });
        }
        
        // ============ OPEN EDIT MODAL ============
        function openEditModal() {
            // Fill form
            document.getElementById('editJina').value = profileUser.jina || '';
            document.getElementById('editPhone').value = profileUser.phone || '';
            document.getElementById('editParokia').value = profileUser.parokia || '';
            document.getElementById('editJimbo').value = profileUser.jimbo || '';
            
            // Reset file
            selectedProfileFile = null;
            document.getElementById('profilePictureInput').value = '';
            
            // Preview
            const initials = generateInitials(profileUser.jina);
            const hasProfilePicture = profileUser.profile_picture && 
                                     profileUser.profile_picture !== 'null' &&
                                     profileUser.profile_picture.trim() !== '';
            
            if (hasProfilePicture) {
                document.getElementById('profileUploadPreview').innerHTML = 
                    `<img src="${profileUser.profile_picture}" alt="Profile">`;
            } else {
                document.getElementById('profileUploadPreview').textContent = initials;
            }
            
            // Clear errors
            document.querySelectorAll('.form-error').forEach(e => e.classList.remove('show'));
            document.querySelectorAll('.form-group input').forEach(i => i.classList.remove('error'));
            
            // Open modal
            document.getElementById('editModal').classList.add('active');
        }
        
        // ============ CLOSE EDIT MODAL ============
        function closeEditModal() {
            document.getElementById('editModal').classList.remove('active');
        }
        
        // ============ SAVE PROFILE ============
        async function saveProfile() {
            const jina = document.getElementById('editJina').value.trim();
            const phone = document.getElementById('editPhone').value.trim();
            const parokia = document.getElementById('editParokia').value.trim();
            const jimbo = document.getElementById('editJimbo').value.trim();
            
            // Validate Jina
            if (!jina) {
                document.getElementById('editJina').classList.add('error');
                const error = document.getElementById('editJinaError');
                error.querySelector('span').textContent = 'Jina linahitajika';
                error.classList.add('show');
                return;
            }
            
            if (jina.length < 2) {
                document.getElementById('editJina').classList.add('error');
                const error = document.getElementById('editJinaError');
                error.querySelector('span').textContent = 'Jina liwe na herufi 2+';
                error.classList.add('show');
                return;
            }
            
            // Validate Phone (kama imewekwa)
            let validPhone = null;
            if (phone) {
                const validation = validatePhone(phone);
                if (!validation.valid) {
                    document.getElementById('editPhone').classList.add('error');
                    const error = document.getElementById('editPhoneError');
                    error.querySelector('span').textContent = validation.error;
                    error.classList.add('show');
                    return;
                }
                validPhone = validation.value;
            }
            
            // Disable button
            const btn = document.getElementById('saveProfileBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Inahifadhi...';
            
            try {
                let profileUrl = profileUser.profile_picture;
                
                // Upload new picture kama ipo
                if (selectedProfileFile) {
                    showLoading('Inapakia picha...');
                    
                    const result = await uploadProfilePicture(selectedProfileFile);
                    
                    if (result.success) {
                        profileUrl = result.url;
                    } else {
                        console.warn('Upload failed:', result.error);
                    }
                    
                    hideLoading();
                }
                
                // Update user
                showLoading('Inahifadhi...');
                
                const { data, error } = await supabaseClient
                    .from('users')
                    .update({
                        jina: jina,
                        phone: validPhone,
                        parokia: parokia || null,
                        jimbo: jimbo || null,
                        profile_picture: profileUrl
                    })
                    .eq('id', profileUser.id)
                    .select();
                
                hideLoading();
                
                if (error) throw error;
                
                // Update local user
                profileUser = data[0];
                saveUser(profileUser);
                
                // Update UI
                renderProfile();
                closeEditModal();
                
                showToast('Profile imehifadhiwa!', 'success');
                
            } catch (error) {
                console.error('Save profile error:', error);
                hideLoading();
                showToast('Imeshindikana: ' + error.message, 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-save"></i> Hifadhi Mabadiliko';
            }
        }
        
        // ============ HELPERS ============
        function generateInitials(jina) {
            if (!jina) return '??';
            const cleaned = jina.trim().replace(/\s+/g, ' ');
            const names = cleaned.split(' ');
            
            if (names.length >= 2) {
                return (names[0].charAt(0) + names[1].charAt(0)).toUpperCase();
            }
            if (names.length === 1 && names[0].length >= 2) {
                return names[0].substring(0, 2).toUpperCase();
            }
            return '??';
        }
        
        function showLoading(text) {
            document.getElementById('loadingOverlayText').textContent = text || 'Inapakia...';
            document.getElementById('loadingOverlay').classList.add('active');
        }
        
        function hideLoading() {
            document.getElementById('loadingOverlay').classList.remove('active');
        }
    </script>
</body>
</html>
