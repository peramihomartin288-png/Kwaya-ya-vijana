<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#020617">
    <title>Wimbo wa Siku - KMCA</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="user-icon-180.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="KMCA">
    <link rel="icon" href="favicon.ico">
    
    <style>
        :root {
            --primary: #d4af37;
            --primary-dark: #b8962e;
            --primary-light: #f0d060;
            --bg-dark: #020617;
            --bg-card: #0f172a;
            --bg-input: #1e293b;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --error: #ef4444;
            --success: #10b981;
            --warning: #f59e0b;
            --info: #3b82f6;
            --purple: #a855f7;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --shadow: 0 4px 20px rgba(0,0,0,0.2);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="light"] {
            --bg-dark: #f8fafc;
            --bg-card: #ffffff;
            --bg-input: #f1f5f9;
            --text-light: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            overflow-x: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-dark);
            color: var(--text-light);
            line-height: 1.6;
            min-height: 100vh;
            padding-bottom: 40px;
            transition: background 0.3s, color 0.3s;
        }

        /* ============ HEADER ============ */
        .page-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 100;
            box-shadow: var(--shadow);
        }

        .back-btn {
            width: 42px;
            height: 42px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            color: var(--text-light);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: var(--transition);
            text-decoration: none;
        }

        .back-btn:hover {
            background: var(--primary);
            color: var(--bg-dark);
            transform: translateX(-2px);
        }

        .page-title {
            font-size: 18px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .page-title i {
            color: var(--purple);
        }

        .header-spacer {
            width: 42px;
        }

        /* ============ MAIN ============ */
        .main-content {
            max-width: 700px;
            margin: 0 auto;
            padding: 76px 12px 20px;
        }

        /* ============ LOADING ============ */
        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 80px 20px;
            gap: 16px;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--bg-input);
            border-top-color: var(--purple);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            color: var(--text-muted);
            font-size: 14px;
        }

        /* ============ SONG CARD ============ */
        .song-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            overflow: hidden;
            animation: slideUp 0.5s ease-out;
            margin-bottom: 16px;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ============ SONG HEADER ============ */
        .song-header {
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.2), rgba(168, 85, 247, 0.05));
            padding: 40px 24px 32px;
            text-align: center;
            position: relative;
            overflow: hidden;
            border-bottom: 1px solid var(--border);
        }

        .song-header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.2) 0%, transparent 70%);
            animation: pulseGlow 4s ease-in-out infinite;
        }

        @keyframes pulseGlow {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }

        /* ============ MUSIC ICON ============ */
        .music-icon {
            width: 100px;
            height: 100px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, var(--purple), #7c3aed);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 44px;
            color: white;
            position: relative;
            z-index: 1;
            box-shadow: 0 15px 40px rgba(168, 85, 247, 0.5);
            animation: musicPulse 2s ease-in-out infinite;
        }

        @keyframes musicPulse {
            0%, 100% { 
                transform: scale(1); 
                box-shadow: 0 15px 40px rgba(168, 85, 247, 0.5);
            }
            50% { 
                transform: scale(1.05); 
                box-shadow: 0 20px 50px rgba(168, 85, 247, 0.7);
            }
        }

        .music-icon.playing {
            animation: musicBounce 0.8s ease-in-out infinite;
        }

        @keyframes musicBounce {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-8px) scale(1.05); }
        }

        .song-title {
            font-size: 26px;
            font-weight: 900;
            color: var(--text-light);
            margin-bottom: 10px;
            position: relative;
            z-index: 1;
            letter-spacing: -0.5px;
            line-height: 1.3;
        }

        .song-date {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(168, 85, 247, 0.15);
            border: 1px solid rgba(168, 85, 247, 0.3);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            color: var(--purple);
            font-weight: 700;
            position: relative;
            z-index: 1;
        }

        /* ============ CUSTOM AUDIO PLAYER ============ */
        .audio-player {
            padding: 24px;
            background: var(--bg-input);
            border-radius: var(--radius-md);
            margin: 20px;
            animation: slideUp 0.5s ease-out 0.1s both;
        }

        .player-cover {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
        }

        .player-cover-art {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, var(--purple), #7c3aed);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: white;
            flex-shrink: 0;
            overflow: hidden;
        }

        .player-cover-art.rotating {
            animation: rotateArt 8s linear infinite;
        }

        @keyframes rotateArt {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .player-cover-info {
            flex: 1;
            min-width: 0;
        }

        .player-cover-info h4 {
            font-size: 15px;
            font-weight: 800;
            color: var(--text-light);
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-cover-info p {
            font-size: 12px;
            color: var(--text-muted);
        }

        .progress-container {
            margin-bottom: 16px;
        }

        .progress-bar-wrapper {
            width: 100%;
            height: 6px;
            background: var(--bg-dark);
            border-radius: 3px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--purple), #c084fc);
            border-radius: 3px;
            width: 0%;
            transition: width 0.1s linear;
        }

        .progress-times {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .player-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        .control-btn {
            width: 44px;
            height: 44px;
            background: transparent;
            border: none;
            color: var(--text-light);
            cursor: pointer;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            transition: var(--transition);
        }

        .control-btn:hover {
            background: var(--bg-dark);
            transform: scale(1.1);
        }

        .control-btn.play-pause {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, var(--purple), #7c3aed);
            color: white;
            font-size: 24px;
            box-shadow: 0 8px 25px rgba(168, 85, 247, 0.4);
        }

        .control-btn.play-pause:hover {
            transform: scale(1.1);
            box-shadow: 0 12px 35px rgba(168, 85, 247, 0.6);
        }

        .control-btn.active {
            color: var(--purple);
        }

        .volume-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }

        .volume-icon {
            color: var(--text-muted);
            font-size: 14px;
            width: 20px;
            cursor: pointer;
        }

        .volume-slider {
            flex: 1;
            height: 4px;
            background: var(--bg-dark);
            border-radius: 2px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .volume-fill {
            height: 100%;
            background: var(--purple);
            border-radius: 2px;
            width: 80%;
            transition: width 0.1s linear;
        }

        /* ============ NATIVE VIDEO PLAYER ============ */
        .video-player-container {
            padding: 20px;
            animation: slideUp 0.5s ease-out;
        }

        .video-player-container video {
            width: 100%;
            border-radius: var(--radius-md);
            display: block;
            max-height: 500px;
            background: #000;
        }

        /* ============ SONG BODY ============ */
        .song-body {
            padding: 0 24px 24px;
        }

        .song-description {
            font-size: 15px;
            color: var(--text-light);
            line-height: 1.8;
            white-space: pre-wrap;
            word-wrap: break-word;
            overflow-wrap: break-word;
            padding: 20px;
            background: var(--bg-input);
            border-radius: var(--radius-md);
            border-left: 4px solid var(--purple);
            animation: slideUp 0.5s ease-out 0.2s both;
        }

        .song-description-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            font-weight: 800;
            color: var(--purple);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }

        /* ============ ACTIONS ============ */
        .song-actions {
            display: flex;
            border-top: 1px solid var(--border);
        }

        .song-action {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            transition: var(--transition);
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
        }

        .song-action:hover {
            background: var(--bg-input);
            color: var(--text-light);
        }

        .song-action.liked {
            color: var(--error);
        }

        .song-action.liked i {
            animation: heartBeat 0.5s;
        }

        @keyframes heartBeat {
            0%, 25%, 50%, 75%, 100% { transform: scale(1); }
            40% { transform: scale(1.3); }
            60% { transform: scale(1.2); }
        }

        /* ============ COMMENTS MODAL ============ */
        .comments-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 5000;
            display: none;
            align-items: flex-end;
            justify-content: center;
            backdrop-filter: blur(8px);
        }

        .comments-modal.active {
            display: flex;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .comments-modal-content {
            background: var(--bg-card);
            border-radius: 20px 20px 0 0;
            width: 100%;
            max-width: 700px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            animation: slideUpModal 0.3s ease-out;
        }

        @keyframes slideUpModal {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .comments-modal-header {
            padding: 18px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .comments-modal-header h3 {
            font-size: 17px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .comments-modal-header h3 i {
            color: var(--primary);
        }

        .comments-modal-close {
            width: 36px;
            height: 36px;
            background: var(--bg-input);
            border: none;
            border-radius: 50%;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }

        .comments-modal-close:hover {
            background: var(--error);
            color: white;
            transform: rotate(90deg);
        }

        .comments-modal-body {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
        }

        .comments-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .comment-item {
            display: flex;
            gap: 12px;
            animation: slideUp 0.3s ease-out;
        }

        .comment-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 800;
            color: var(--bg-dark);
            flex-shrink: 0;
            overflow: hidden;
        }

        .comment-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .comment-body {
            flex: 1;
            min-width: 0;
        }

        .comment-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 4px;
        }

        .comment-author {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-light);
        }

        .comment-time {
            font-size: 11px;
            color: var(--text-muted);
        }

        .comment-text {
            font-size: 14px;
            color: var(--text-light);
            line-height: 1.5;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .no-comments {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
        }

        .no-comments i {
            font-size: 48px;
            color: var(--border);
            display: block;
            margin-bottom: 12px;
        }

        .comments-modal-footer {
            padding: 12px 20px 20px;
            border-top: 1px solid var(--border);
        }

        .comment-input-container {
            display: flex;
            gap: 10px;
        }

        .comment-input {
            flex: 1;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 12px 16px;
            color: var(--text-light);
            font-size: 14px;
            outline: none;
            font-family: inherit;
        }

        .comment-input:focus {
            border-color: var(--primary);
        }

        .btn-send-comment {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: var(--bg-dark);
            border: none;
            border-radius: var(--radius-md);
            padding: 12px 18px;
            font-size: 16px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-prompt {
            background: var(--bg-input);
            border: 1px dashed var(--border);
            border-radius: var(--radius-md);
            padding: 20px;
            text-align: center;
        }

        .login-prompt i {
            font-size: 32px;
            color: var(--primary);
            margin-bottom: 10px;
        }

        .login-prompt p {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 14px;
        }

        .btn-login-prompt {
            background: var(--primary);
            color: var(--bg-dark);
            border: none;
            border-radius: var(--radius-md);
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            font-family: inherit;
        }

        /* ============ SHARE MODAL ============ */
        .share-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 5000;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            backdrop-filter: blur(5px);
            animation: fadeIn 0.2s;
        }

        .share-modal-content {
            background: var(--bg-card);
            border-radius: 20px 20px 0 0;
            width: 100%;
            max-width: 500px;
            padding: 24px 20px;
            animation: slideUpModal 0.3s ease-out;
        }

        .share-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .share-modal-header h3 {
            font-size: 18px;
            font-weight: 800;
        }

        .share-modal-close {
            width: 36px;
            height: 36px;
            background: var(--bg-input);
            border: none;
            border-radius: 50%;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 16px;
        }

        .share-options-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .share-option {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding: 16px 8px;
            background: var(--bg-input);
            border-radius: var(--radius-md);
            border: none;
            color: var(--text-light);
            text-decoration: none;
            cursor: pointer;
            transition: var(--transition);
            font-family: inherit;
        }

        .share-option:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        .share-option i { font-size: 28px; }
        .share-option span { font-size: 12px; font-weight: 600; }

        .share-option.whatsapp i { color: #25D366; }
        .share-option.facebook i { color: #1877F2; }
        .share-option.twitter i { color: #1DA1F2; }
        .share-option.telegram i { color: #0088cc; }
        .share-option.copy i { color: var(--primary); }

        .share-url-preview input {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 12px;
            color: var(--text-muted);
            font-size: 12px;
            outline: none;
        }

        /* ============ EMPTY STATE ============ */
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-muted);
        }

        .empty-state i {
            font-size: 72px;
            color: var(--border);
            margin-bottom: 20px;
        }

        .empty-state h3 {
            font-size: 20px;
            font-weight: 800;
            color: var(--text-light);
            margin-bottom: 10px;
        }

        .btn-home {
            background: var(--primary);
            color: var(--bg-dark);
            border: none;
            border-radius: var(--radius-md);
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            font-family: inherit;
        }

        /* ============ TOAST ============ */
        .kmca-toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: var(--success);
            color: white;
            padding: 14px 24px;
            border-radius: var(--radius-md);
            font-size: 14px;
            font-weight: 600;
            z-index: 99999;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 10px;
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            max-width: 90%;
        }

        /* ============ RESPONSIVE ============ */
        @media (max-width: 480px) {
            .main-content {
                padding: 76px 8px 20px;
            }
            
            .song-title {
                font-size: 22px;
            }
            
            .song-body {
                padding: 0 16px 20px;
            }
            
            .song-header {
                padding: 32px 16px 24px;
            }
            
            .music-icon {
                width: 80px;
                height: 80px;
                font-size: 36px;
            }
            
            .audio-player {
                padding: 20px 16px;
                margin: 16px;
            }
        }
    </style>
</head>
<body>
    
    <!-- ============ HEADER ============ -->
    <header class="page-header">
        <a href="home.html" class="back-btn" id="backBtn">
            <i class="fas fa-arrow-left"></i>
        </a>
        <div class="page-title">
            <i class="fas fa-music"></i>
            Wimbo wa Siku
        </div>
        <div class="header-spacer"></div>
    </header>
    
    <!-- ============ MAIN CONTENT ============ -->
    <main class="main-content" id="mainContent">
        <div class="loading-container">
            <div class="loading-spinner"></div>
            <div class="loading-text">Inapakia...</div>
        </div>
    </main>
    
    <!-- ============ SCRIPTS ============ -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="user-auth.js"></script>
    <script src="dark-mode.js"></script>
    
    <script>
        // ============================================
        // WIMBO PAGE - wimbo.html
        // ============================================
        
        let currentUser = null;
        let settings = {};
        let songData = null;
        let songId = '';
        let comments = [];
        let audioElement = null;
        let isLooping = false;
        
        document.addEventListener('DOMContentLoaded', async function() {
            console.log('Wimbo page - Initializing');
            
            currentUser = getCurrentUser();
            
            const params = new URLSearchParams(window.location.search);
            songId = params.get('id');
            
            if (!songId) {
                renderError('Wimbo haipatikani', 'Link si sahihi');
                return;
            }
            
            settings = await loadSettings();
            await loadSong();
            await loadComments();
            renderSong();
            setupEvents();
        });
        
        // ============ LOAD SETTINGS ============
        async function loadSettings() {
            try {
                const { data } = await supabaseClient
                    .from('app_settings')
                    .select('setting_key, setting_value');
                
                const obj = {};
                (data || []).forEach(s => {
                    obj[s.setting_key] = s.setting_value;
                });
                
                return obj;
            } catch (e) {
                return {};
            }
        }
        
        // ============ LOAD SONG ============
        async function loadSong() {
            try {
                const { data, error } = await supabaseClient
                    .from('nyimbo_za_siku')
                    .select('*')
                    .eq('id', songId)
                    .single();
                
                if (error || !data) {
                    renderError('Wimbo haipatikani', 'Huenda imefutwa au link si sahihi');
                    return;
                }
                
                songData = data;
                console.log('Song loaded:', data);
                
            } catch (e) {
                console.error('Load song error:', e);
                renderError('Imeshindikana', 'Tafadhali jaribu tena');
            }
        }
        
        // ============ LOAD COMMENTS ============
        async function loadComments() {
            try {
                const { data } = await supabaseClient
                    .from('comments')
                    .select('*, users(jina, profile_picture)')
                    .eq('content_type', 'song')
                    .eq('content_id', songId)
                    .order('created_at', { ascending: false })
                    .limit(50);
                
                comments = data || [];
            } catch (e) {
                comments = [];
            }
        }
        
        // ============ RENDER SONG ============
        function renderSong() {
            const main = document.getElementById('mainContent');
            
            let dateHtml = '';
            if (songData.tarehe) {
                const dateFormatted = new Date(songData.tarehe).toLocaleDateString('sw-TZ', {
                    day: 'numeric',
                    month: 'long',
                    year: 'numeric'
                });
                
                dateHtml = `
                    <div class="song-date">
                        <i class="fas fa-calendar"></i>
                        ${dateFormatted}
                    </div>
                `;
            }
            
            let mediaHtml = '';
            
            if (songData.media_type === 'video') {
                mediaHtml = `
                    <div class="video-player-container">
                        <video id="videoPlayer" src="${songData.media_file}" controls playsinline preload="metadata"></video>
                    </div>
                `;
            } else {
                mediaHtml = `
                    <div class="audio-player">
                        <div class="player-cover">
                            <div class="player-cover-art" id="coverArt">
                                <i class="fas fa-music"></i>
                            </div>
                            <div class="player-cover-info">
                                <h4>${escapeHtml(songData.jina)}</h4>
                                <p>KMCA - Kwaya ya Vijito</p>
                            </div>
                        </div>
                        
                        <div class="progress-container">
                            <div class="progress-bar-wrapper" id="progressWrapper">
                                <div class="progress-bar-fill" id="progressFill"></div>
                            </div>
                            <div class="progress-times">
                                <span id="currentTime">0:00</span>
                                <span id="duration">0:00</span>
                            </div>
                        </div>
                        
                        <div class="player-controls">
                            <button class="control-btn" id="loopBtn" title="Loop">
                                <i class="fas fa-redo"></i>
                            </button>
                            <button class="control-btn" id="rewindBtn" title="Rudi 10s">
                                <i class="fas fa-undo"></i>
                            </button>
                            <button class="control-btn play-pause" id="playPauseBtn" title="Play">
                                <i class="fas fa-play"></i>
                            </button>
                            <button class="control-btn" id="forwardBtn" title="Mbele 10s">
                                <i class="fas fa-redo"></i>
                            </button>
                            <button class="control-btn" id="volumeBtn" title="Volume">
                                <i class="fas fa-volume-up"></i>
                            </button>
                        </div>
                        
                        <div class="volume-container">
                            <i class="fas fa-volume-down volume-icon" id="volumeIcon"></i>
                            <div class="volume-slider" id="volumeSlider">
                                <div class="volume-fill" id="volumeFill"></div>
                            </div>
                            <i class="fas fa-volume-up volume-icon"></i>
                        </div>
                        
                        <audio id="audioPlayer" src="${songData.media_file}" preload="metadata"></audio>
                    </div>
                `;
            }
            
            let descriptionHtml = '';
            if (songData.maelezo) {
                descriptionHtml = `
                    <div class="song-description">
                        <div class="song-description-label">
                            <i class="fas fa-info-circle"></i>
                            Maelezo
                        </div>
                        ${escapeHtml(songData.maelezo)}
                    </div>
                `;
            }
            
            const html = `
                <div class="song-card">
                    <div class="song-header">
                        <div class="music-icon" id="musicIcon">
                            <i class="fas fa-music"></i>
                        </div>
                        <h1 class="song-title">${escapeHtml(songData.jina)}</h1>
                        ${dateHtml}
                    </div>
                    
                    ${mediaHtml}
                    
                    ${descriptionHtml ? `<div class="song-body">${descriptionHtml}</div>` : ''}
                    
                    <div class="song-actions">
                        <button class="song-action song-like-btn">
                            <i class="far fa-heart"></i>
                            <span class="like-count">0</span>
                        </button>
                        <button class="song-action song-comment-btn">
                            <i class="far fa-comment"></i>
                            <span class="comment-count">${comments.length}</span>
                        </button>
                        <button class="song-action song-share-btn">
                            <i class="fas fa-share"></i>
                            <span class="share-count">0</span>
                        </button>
                        <button class="song-action song-download-btn">
                            <i class="fas fa-download"></i>
                            <span class="download-count">0</span>
                        </button>
                    </div>
                </div>
            `;
            
            main.innerHTML = html;
            
            if (songData.media_type !== 'video') {
                setupAudioPlayer();
            } else {
                setupVideoPlayer();
            }
            
            loadCounts();
            
            if (currentUser) {
                loadUserLike();
            }
        }
        
        // ============ SETUP AUDIO PLAYER ============
        function setupAudioPlayer() {
            audioElement = document.getElementById('audioPlayer');
            const playPauseBtn = document.getElementById('playPauseBtn');
            const progressWrapper = document.getElementById('progressWrapper');
            const progressFill = document.getElementById('progressFill');
            const currentTimeEl = document.getElementById('currentTime');
            const durationEl = document.getElementById('duration');
            const loopBtn = document.getElementById('loopBtn');
            const rewindBtn = document.getElementById('rewindBtn');
            const forwardBtn = document.getElementById('forwardBtn');
            const volumeBtn = document.getElementById('volumeBtn');
            const volumeSlider = document.getElementById('volumeSlider');
            const volumeFill = document.getElementById('volumeFill');
            const musicIcon = document.getElementById('musicIcon');
            const coverArt = document.getElementById('coverArt');
            
            playPauseBtn.addEventListener('click', function() {
                if (audioElement.paused) {
                    audioElement.play();
                } else {
                    audioElement.pause();
                }
            });
            
            audioElement.addEventListener('play', function() {
                playPauseBtn.innerHTML = '<i class="fas fa-pause"></i>';
                musicIcon.classList.add('playing');
                if (coverArt) coverArt.classList.add('rotating');
            });
            
            audioElement.addEventListener('pause', function() {
                playPauseBtn.innerHTML = '<i class="fas fa-play"></i>';
                musicIcon.classList.remove('playing');
                if (coverArt) coverArt.classList.remove('rotating');
            });
            
            audioElement.addEventListener('timeupdate', function() {
                if (audioElement.duration) {
                    const percent = (audioElement.currentTime / audioElement.duration) * 100;
                    progressFill.style.width = percent + '%';
                    currentTimeEl.textContent = formatTime(audioElement.currentTime);
                }
            });
            
            audioElement.addEventListener('loadedmetadata', function() {
                durationEl.textContent = formatTime(audioElement.duration);
            });
            
            audioElement.addEventListener('ended', function() {
                playPauseBtn.innerHTML = '<i class="fas fa-play"></i>';
                musicIcon.classList.remove('playing');
                if (coverArt) coverArt.classList.remove('rotating');
                progressFill.style.width = '0%';
                currentTimeEl.textContent = '0:00';
            });
            
            progressWrapper.addEventListener('click', function(e) {
                const rect = this.getBoundingClientRect();
                const percent = (e.clientX - rect.left) / rect.width;
                audioElement.currentTime = percent * audioElement.duration;
            });
            
            loopBtn.addEventListener('click', function() {
                isLooping = !isLooping;
                audioElement.loop = isLooping;
                this.classList.toggle('active', isLooping);
                showToast(isLooping ? 'Loop imewashwa' : 'Loop imezimwa', 'info');
            });
            
            rewindBtn.addEventListener('click', function() {
                audioElement.currentTime = Math.max(0, audioElement.currentTime - 10);
            });
            
            forwardBtn.addEventListener('click', function() {
                audioElement.currentTime = Math.min(audioElement.duration, audioElement.currentTime + 10);
            });
            
            volumeBtn.addEventListener('click', function() {
                audioElement.muted = !audioElement.muted;
                this.innerHTML = audioElement.muted 
                    ? '<i class="fas fa-volume-mute"></i>' 
                    : '<i class="fas fa-volume-up"></i>';
                volumeFill.style.width = audioElement.muted ? '0%' : (audioElement.volume * 100) + '%';
            });
            
            volumeSlider.addEventListener('click', function(e) {
                const rect = this.getBoundingClientRect();
                const volume = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
                audioElement.volume = volume;
                audioElement.muted = false;
                volumeFill.style.width = (volume * 100) + '%';
                volumeBtn.innerHTML = volume === 0 
                    ? '<i class="fas fa-volume-mute"></i>' 
                    : '<i class="fas fa-volume-up"></i>';
            });
            
            audioElement.volume = 0.8;
        }
        
        // ============ SETUP VIDEO PLAYER ============
        function setupVideoPlayer() {
            const videoPlayer = document.getElementById('videoPlayer');
            
            videoPlayer.addEventListener('play', function() {
                const musicIcon = document.getElementById('musicIcon');
                if (musicIcon) musicIcon.classList.add('playing');
            });
            
            videoPlayer.addEventListener('pause', function() {
                const musicIcon = document.getElementById('musicIcon');
                if (musicIcon) musicIcon.classList.remove('playing');
            });
            
            videoPlayer.addEventListener('ended', function() {
                const musicIcon = document.getElementById('musicIcon');
                if (musicIcon) musicIcon.classList.remove('playing');
            });
        }
        
        // ============ FORMAT TIME ============
        function formatTime(seconds) {
            if (isNaN(seconds)) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return mins + ':' + (secs < 10 ? '0' : '') + secs;
        }
        
        // ============ LOAD COUNTS ============
        async function loadCounts() {
            try {
                const { count: likeCount } = await supabaseClient
                    .from('content_likes')
                    .select('*', { count: 'exact', head: true })
                    .eq('content_type', 'song')
                    .eq('content_id', songId);
                
                const likeEl = document.querySelector('.like-count');
                if (likeEl) likeEl.textContent = likeCount || 0;
                
                const { count: shareCount } = await supabaseClient
                    .from('content_shares')
                    .select('*', { count: 'exact', head: true })
                    .eq('content_type', 'song')
                    .eq('content_id', songId);
                
                const shareEl = document.querySelector('.share-count');
                if (shareEl) shareEl.textContent = shareCount || 0;
                
                const { count: downloadCount } = await supabaseClient
                    .from('content_downloads')
                    .select('*', { count: 'exact', head: true })
                    .eq('content_type', 'song')
                    .eq('content_id', songId);
                
                const downloadEl = document.querySelector('.download-count');
                if (downloadEl) downloadEl.textContent = downloadCount || 0;
            } catch (e) {}
        }
        
        // ============ LOAD USER LIKE ============
        async function loadUserLike() {
            try {
                const { data } = await supabaseClient
                    .from('content_likes')
                    .select('id')
                    .eq('user_id', currentUser.id)
                    .eq('content_type', 'song')
                    .eq('content_id', songId)
                    .maybeSingle();
                
                if (data) {
                    const btn = document.querySelector('.song-like-btn');
                    if (btn) {
                        btn.classList.add('liked');
                        btn.querySelector('i').className = 'fas fa-heart';
                    }
                }
            } catch (e) {}
        }
        
        // ============ SETUP EVENTS ============
        function setupEvents() {
            // ✅ Back button - RUDI HOME.HTML
            document.getElementById('backBtn').addEventListener('click', function(e) {
                e.preventDefault();
                window.location.href = 'home.html';
            });
            
            const likeBtn = document.querySelector('.song-like-btn');
            if (likeBtn) {
                likeBtn.addEventListener('click', async function() {
                    if (!currentUser) {
                        showToast('Ingia ili ku-like', 'warning');
                        return;
                    }
                    await toggleLike(this);
                });
            }
            
            const commentBtn = document.querySelector('.song-comment-btn');
            if (commentBtn) {
                commentBtn.addEventListener('click', openCommentsModal);
            }
            
            const shareBtn = document.querySelector('.song-share-btn');
            if (shareBtn) {
                shareBtn.addEventListener('click', shareContent);
            }
            
            const downloadBtn = document.querySelector('.song-download-btn');
            if (downloadBtn) {
                downloadBtn.addEventListener('click', showDownloadOptions);
            }
        }
        
        // ============ TOGGLE LIKE ============
        async function toggleLike(btn) {
            try {
                const { data: existing } = await supabaseClient
                    .from('content_likes')
                    .select('id')
                    .eq('user_id', currentUser.id)
                    .eq('content_type', 'song')
                    .eq('content_id', songId)
                    .maybeSingle();
                
                if (existing) {
                    await supabaseClient.from('content_likes').delete().eq('id', existing.id);
                    btn.classList.remove('liked');
                    btn.querySelector('i').className = 'far fa-heart';
                } else {
                    await supabaseClient.from('content_likes').insert([{
                        user_id: currentUser.id,
                        content_type: 'song',
                        content_id: songId
                    }]);
                    btn.classList.add('liked');
                    btn.querySelector('i').className = 'fas fa-heart';
                }
                
                await loadCounts();
            } catch (e) {}
        }
        
        // ============ OPEN COMMENTS MODAL ============
        function openCommentsModal() {
            const existing = document.getElementById('commentsModal');
            if (existing) existing.remove();
            
            const modal = document.createElement('div');
            modal.id = 'commentsModal';
            modal.className = 'comments-modal active';
            
            let commentsHtml = comments.length === 0
                ? `<div class="no-comments"><i class="fas fa-comments"></i>Hakuna comments bado</div>`
                : `<div class="comments-list">${comments.map(renderComment).join('')}</div>`;
            
            let footerHtml = currentUser
                ? `
                    <div class="comments-modal-footer">
                        <div class="comment-input-container">
                            <input type="text" class="comment-input" id="commentInput" placeholder="Andika comment...">
                            <button class="btn-send-comment" id="sendCommentBtn">
                                <i class="fas fa-paper-plane"></i>
                            </button>
                        </div>
                    </div>
                `
                : `
                    <div class="comments-modal-footer">
                        <div class="login-prompt">
                            <i class="fas fa-user-circle"></i>
                            <p>Jiandikishe ili ku-comment</p>
                            <button class="btn-login-prompt" onclick="window.location.href='index.html'">
                                <i class="fas fa-sign-in-alt"></i>
                                Ingia
                            </button>
                        </div>
                    </div>
                `;
            
            modal.innerHTML = `
                <div class="comments-modal-content">
                    <div class="comments-modal-header">
                        <h3><i class="fas fa-comments"></i> Comments (${comments.length})</h3>
                        <button class="comments-modal-close" id="commentsModalClose">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                    <div class="comments-modal-body" id="commentsModalBody">
                        ${commentsHtml}
                    </div>
                    ${footerHtml}
                </div>
            `;
            
            document.body.appendChild(modal);
            
            document.getElementById('commentsModalClose').addEventListener('click', () => modal.remove());
            modal.addEventListener('click', function(e) {
                if (e.target === modal) modal.remove();
            });
            
            if (currentUser) {
                const sendBtn = document.getElementById('sendCommentBtn');
                const input = document.getElementById('commentInput');
                
                if (sendBtn) sendBtn.addEventListener('click', sendComment);
                if (input) {
                    input.addEventListener('keypress', function(e) {
                        if (e.key === 'Enter') sendComment();
                    });
                }
            }
        }
        
        // ============ RENDER COMMENT ============
        function renderComment(comment) {
            const user = comment.users || {};
            const initials = generateInitials(user.jina);
            
            const avatarHtml = user.profile_picture
                ? `<img src="${user.profile_picture}" alt="${user.jina}">`
                : initials;
            
            return `
                <div class="comment-item">
                    <div class="comment-avatar">${avatarHtml}</div>
                    <div class="comment-body">
                        <div class="comment-header">
                            <span class="comment-author">${escapeHtml(user.jina || 'Mtumiaji')}</span>
                            <span class="comment-time">${getTimeAgo(comment.created_at)}</span>
                        </div>
                        <div class="comment-text">${escapeHtml(comment.content)}</div>
                    </div>
                </div>
            `;
        }
        
        // ============ SEND COMMENT ============
        async function sendComment() {
            if (!currentUser) return;
            
            const input = document.getElementById('commentInput');
            const content = input.value.trim();
            
            if (!content) return;
            
            const btn = document.getElementById('sendCommentBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
            
            try {
                await supabaseClient.from('comments').insert([{
                    user_id: currentUser.id,
                    content_type: 'song',
                    content_id: songId,
                    content: content
                }]);
                
                input.value = '';
                await loadComments();
                
                const body = document.getElementById('commentsModalBody');
                if (body) {
                    body.innerHTML = comments.length === 0
                        ? '<div class="no-comments"><i class="fas fa-comments"></i>Hakuna comments bado</div>'
                        : `<div class="comments-list">${comments.map(renderComment).join('')}</div>`;
                }
                
                const countEl = document.querySelector('.comment-count');
                if (countEl) countEl.textContent = comments.length;
                
                showToast('Comment imetumwa!', 'success');
            } catch (e) {
                showToast('Imeshindikana', 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-paper-plane"></i>';
            }
        }
        
        // ============ SHARE CONTENT ============
        async function shareContent() {
            try {
                const baseUrl = settings.share_link || window.location.origin;
                const pagePath = settings.share_page_path || '/share.html';
                const shareUrl = `${baseUrl}${pagePath}?type=song&id=${songId}`;
                
                if (currentUser) {
                    await supabaseClient.from('content_shares').insert([{
                        user_id: currentUser.id,
                        content_type: 'song',
                        content_id: songId
                    }]);
                    await loadCounts();
                }
                
                showShareOptions(shareUrl, `Wimbo: ${songData.jina}`);
            } catch (e) {}
        }
        
        // ============ SHOW SHARE OPTIONS ============
        function showShareOptions(shareUrl, title) {
            const existing = document.getElementById('shareOptionsModal');
            if (existing) existing.remove();
            
            const modal = document.createElement('div');
            modal.id = 'shareOptionsModal';
            modal.className = 'share-modal';
            modal.innerHTML = `
                <div class="share-modal-content">
                    <div class="share-modal-header">
                        <h3>Share kwa</h3>
                        <button class="share-modal-close" onclick="document.getElementById('shareOptionsModal').remove()">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                    
                    <div class="share-options-grid">
                        <a href="https://wa.me/?text=${encodeURIComponent(title + ' - ' + shareUrl)}" target="_blank" class="share-option whatsapp">
                            <i class="fab fa-whatsapp"></i>
                            <span>WhatsApp</span>
                        </a>
                        <a href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(shareUrl)}" target="_blank" class="share-option facebook">
                            <i class="fab fa-facebook"></i>
                            <span>Facebook</span>
                        </a>
                        <a href="https://twitter.com/intent/tweet?text=${encodeURIComponent(title)}&url=${encodeURIComponent(shareUrl)}" target="_blank" class="share-option twitter">
                            <i class="fab fa-twitter"></i>
                            <span>Twitter</span>
                        </a>
                        <a href="https://t.me/share/url?url=${encodeURIComponent(shareUrl)}&text=${encodeURIComponent(title)}" target="_blank" class="share-option telegram">
                            <i class="fab fa-telegram"></i>
                            <span>Telegram</span>
                        </a>
                        <button class="share-option copy" onclick="copyShareLink('${shareUrl}')">
                            <i class="fas fa-link"></i>
                            <span>Copy Link</span>
                        </button>
                    </div>
                    
                    <div class="share-url-preview">
                        <input type="text" value="${shareUrl}" readonly onclick="this.select()">
                    </div>
                </div>
            `;
            
            document.body.appendChild(modal);
            modal.addEventListener('click', function(e) {
                if (e.target === modal) modal.remove();
            });
        }
        
        // ============ COPY SHARE LINK ============
        async function copyShareLink(url) {
            try {
                await navigator.clipboard.writeText(url);
                showToast('Link imecopywa!', 'success');
                document.getElementById('shareOptionsModal')?.remove();
            } catch (e) {
                const input = document.createElement('input');
                input.value = url;
                document.body.appendChild(input);
                input.select();
                document.execCommand('copy');
                document.body.removeChild(input);
                showToast('Link imecopywa!', 'success');
            }
        }
        
        // ============ SHOW DOWNLOAD OPTIONS ============
        function showDownloadOptions() {
            const existing = document.getElementById('downloadOptionsModal');
            if (existing) existing.remove();
            
            const modal = document.createElement('div');
            modal.id = 'downloadOptionsModal';
            modal.className = 'share-modal';
            modal.innerHTML = `
                <div class="share-modal-content">
                    <div class="share-modal-header">
                        <h3>Download</h3>
                        <button class="share-modal-close" onclick="document.getElementById('downloadOptionsModal').remove()">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                    
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                        <button class="share-option" onclick="downloadMedia()" style="padding: 20px 12px;">
                            <i class="fas fa-${songData.media_type === 'video' ? 'video' : 'music'}" style="color: #a855f7;"></i>
                            <span>${songData.media_type === 'video' ? 'Video' : 'Audio'}</span>
                        </button>
                        <button class="share-option" onclick="downloadWithCover()" style="padding: 20px 12px;">
                            <i class="fas fa-image" style="color: #d4af37;"></i>
                            <span>Cover Art</span>
                        </button>
                    </div>
                </div>
            `;
            
            document.body.appendChild(modal);
            modal.addEventListener('click', function(e) {
                if (e.target === modal) modal.remove();
            });
        }
        
        // ============ DOWNLOAD MEDIA (Audio/Video) ============
        async function downloadMedia() {
            document.getElementById('downloadOptionsModal')?.remove();
            
            if (!songData.media_file) {
                showToast('Hakuna file ya download', 'warning');
                return;
            }
            
            try {
                showToast('Download inaanza...', 'info');
                
                if (currentUser) {
                    await supabaseClient.from('content_downloads').insert([{
                        user_id: currentUser.id,
                        content_type: 'song',
                        content_id: songId
                    }]);
                    await loadCounts();
                }
                
                const response = await fetch(songData.media_file);
                const blob = await response.blob();
                const url = URL.createObjectURL(blob);
                
                const link = document.createElement('a');
                link.href = url;
                link.download = `Wimbo-${songData.jina.replace(/\s+/g, '-')}.${getFileExt(songData.media_type)}`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
                
                showToast('Download imekamilika!', 'success');
            } catch (e) {
                console.error('Download error:', e);
                showToast('Imeshindikana ku-download', 'error');
            }
        }
        
        // ============ DOWNLOAD WITH COVER ART ============
        async function downloadWithCover() {
            document.getElementById('downloadOptionsModal')?.remove();
            
            try {
                showToast('Inaandaa...', 'info');
                
                if (currentUser) {
                    await supabaseClient.from('content_downloads').insert([{
                        user_id: currentUser.id,
                        content_type: 'song',
                        content_id: songId
                    }]);
                    await loadCounts();
                }
                
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                
                canvas.width = 1080;
                canvas.height = 1080;
                
                const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
                gradient.addColorStop(0, '#020617');
                gradient.addColorStop(0.5, '#1a0b2e');
                gradient.addColorStop(1, '#020617');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.fillStyle = 'rgba(168, 85, 247, 0.1)';
                ctx.beginPath();
                ctx.arc(200, 200, 300, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.beginPath();
                ctx.arc(900, 900, 400, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.fillStyle = 'rgba(168, 85, 247, 0.2)';
                ctx.beginPath();
                ctx.arc(canvas.width / 2, 350, 140, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.strokeStyle = '#a855f7';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.arc(canvas.width / 2, 350, 140, 0, Math.PI * 2);
                ctx.stroke();
                
                ctx.font = '120px -apple-system, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('🎵', canvas.width / 2, 350);
                
                ctx.fillStyle = '#d4af37';
                ctx.font = 'bold 48px -apple-system, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'alphabetic';
                ctx.fillText(songData.jina, canvas.width / 2, 600);
                
                if (songData.maelezo) {
                    ctx.fillStyle = '#94a3b8';
                    ctx.font = '28px -apple-system, sans-serif';
                    const shortDesc = songData.maelezo.substring(0, 100);
                    ctx.fillText(shortDesc, canvas.width / 2, 670);
                }
                
                if (songData.tarehe) {
                    ctx.fillStyle = '#a855f7';
                    ctx.font = 'bold 32px -apple-system, sans-serif';
                    const dateFormatted = new Date(songData.tarehe).toLocaleDateString('sw-TZ', {
                        day: 'numeric',
                        month: 'long',
                        year: 'numeric'
                    });
                    ctx.fillText('📅 ' + dateFormatted, canvas.width / 2, 750);
                }
                
                ctx.fillStyle = 'rgba(212, 175, 55, 0.9)';
                ctx.font = 'bold 28px -apple-system, sans-serif';
                ctx.fillText('Kwaya ya Mtakatifu Carlo Acutis', canvas.width / 2, canvas.height - 100);
                ctx.fillStyle = '#d4af37';
                ctx.font = 'bold 42px -apple-system, sans-serif';
                ctx.fillText('KMCA', canvas.width / 2, canvas.height - 50);
                
                canvas.toBlob(function(blob) {
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = `Wimbo-${songData.jina.replace(/\s+/g, '-')}-cover.png`;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    URL.revokeObjectURL(url);
                    
                    showToast('Cover imedownloadwa!', 'success');
                }, 'image/png');
                
            } catch (e) {
                console.error('Download cover error:', e);
                showToast('Imeshindikana', 'error');
            }
        }
        
        // ============ GET FILE EXTENSION ============
        function getFileExt(mediaType) {
            if (mediaType === 'video') return 'mp4';
            return 'mp3';
        }
        
        // ============ RENDER ERROR ============
        function renderError(title, message) {
            const main = document.getElementById('mainContent');
            main.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-music"></i>
                    <h3>${title}</h3>
                    <p>${message}</p>
                    <button class="btn-home" onclick="window.location.href='home.html'">
                        <i class="fas fa-home"></i>
                        Rudi Home
                    </button>
                </div>
            `;
        }
        
        // ============ HELPERS ============
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function generateInitials(jina) {
            if (!jina) return '??';
            const cleaned = jina.trim().replace(/\s+/g, ' ');
            const names = cleaned.split(' ');
            
            if (names.length >= 2) {
                return (names[0].charAt(0) + names[1].charAt(0)).toUpperCase();
            }
            if (names.length === 1 && names[0].length >= 2) {
                return names[0].substring(0, 2).toUpperCase();
            }
            return '??';
        }
        
        function getTimeAgo(dateString) {
            if (!dateString) return '';
            const date = new Date(dateString);
            const now = new Date();
            const seconds = Math.floor((now - date) / 1000);
            
            if (seconds < 60) return 'Sasa hivi';
            if (seconds < 3600) return Math.floor(seconds / 60) + 'm';
            if (seconds < 86400) return Math.floor(seconds / 3600) + 'h';
            if (seconds < 604800) return Math.floor(seconds / 86400) + 'd';
            
            return date.toLocaleDateString('sw-TZ', { day: 'numeric', month: 'short' });
        }
    </script>
