<body class="welcome-body">

                Karibu <span id="welcomeName">Mtumiaji</span>!

            <!-- Subtitle -->
            <p class="welcome-subtitle">
                Kwenye Jukwaa la Kidini la KMCA

            <!-- Icon -->

                <i class="fas fa-dove"></i>

            <!-- Continue Button -->
            <button class="btn-continue" id="welcomeContinue">
                Endelea
                <i class="fas fa-arrow-right"></i>

    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const user = getCurrentUser();
            
            if (!user) {
                window.location.href = 'register.html';
                return;
            }
            
            // Generate avatar
            const names = user.jina.split(' ');
            let avatarText = '';
            
            if (names.length >= 2) {
                avatarText = (names[0][0] + names[1][0]).toUpperCase();
            } else if (names.length === 1 && names[0].length >= 2) {
                avatarText = names[0].substring(0, 2).toUpperCase();
            } else {
                avatarText = '??';
            }
            
            document.getElementById('welcomeAvatar').textContent = avatarText;
            document.getElementById('welcomeName').textContent = user.jina.split(' ')[0];
        });
        
        document.getElementById('welcomeContinue').addEventListener('click', function() {
            const user = getCurrentUser();
            
            if (user && user.has_shared) {
                window.location.href = 'home.html';
            } else {
                window.location.href = 'share.html';
            }
        });
    </script>
