<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#020617">
    <title>Karibu - KMCA</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="user-icon-180.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="KMCA">
    <link rel="icon" href="favicon.ico">
    
    <style>
        :root {
            --primary: #d4af37;
            --primary-dark: #b8962e;
            --primary-light: #f0d060;
            --gold: #d4af37;
            --gold-light: #f0d060;
            --gold-dark: #b8962e;
            --bg-dark: #020617;
            --bg-card: #0f172a;
            --bg-input: #1e293b;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 20px;
            --shadow: 0 10px 40px rgba(0,0,0,0.3);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; overflow-x: hidden; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-dark);
            color: var(--text-light);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: 
                radial-gradient(circle at 20% 50%, rgba(212, 175, 55, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(212, 175, 55, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 50% 80%, rgba(212, 175, 55, 0.08) 0%, transparent 50%);
            animation: bgFloat 10s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes bgFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }

        .welcome-container {
            width: 100%;
            max-width: 480px;
            position: relative;
            z-index: 1;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        .welcome-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow);
            text-align: center;
        }

        .welcome-media {
            width: 100%;
            aspect-ratio: 16/9;
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.15), rgba(212, 175, 55, 0.05));
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .welcome-media img,
        .welcome-media video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .avatar-wrapper {
            margin-top: 24px;
            margin-bottom: 20px;
            padding: 0 24px;
            position: relative;
        }

        .avatar-wrapper.with-media {
            margin-top: -60px;
        }

        .profile-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            font-weight: 800;
            color: var(--bg-dark);
            margin: 0 auto;
            overflow: hidden;
            border: 4px solid var(--bg-card);
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.4);
            position: relative;
            z-index: 2;
            animation: avatarPulse 3s ease-in-out infinite;
            letter-spacing: 2px;
        }

        @keyframes avatarPulse {
            0%, 100% { transform: scale(1); box-shadow: 0 10px 30px rgba(212, 175, 55, 0.4); }
            50% { transform: scale(1.03); box-shadow: 0 15px 40px rgba(212, 175, 55, 0.6); }
        }

        .profile-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .welcome-body {
            padding: 0 28px 32px;
        }

        .welcome-title {
            font-size: 28px;
            font-weight: 900;
            color: var(--text-light);
            margin-bottom: 10px;
            letter-spacing: -0.5px;
            line-height: 1.2;
            animation: slideUp 0.6s ease-out 0.2s both;
        }

        .welcome-title .greeting {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 8px;
            opacity: 0.9;
        }

        .welcome-title .user-name {
            display: block;
            font-size: 32px;
            font-weight: 900;
            background: linear-gradient(135deg, var(--gold-light), var(--gold), var(--gold-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 16px;
            text-shadow: 0 4px 20px rgba(212, 175, 55, 0.3);
        }

        .welcome-subtitle {
            font-size: 15px;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-weight: 500;
            line-height: 1.6;
            animation: slideUp 0.6s ease-out 0.3s both;
        }

        .welcome-subtitle .church-name {
            display: block;
            color: var(--gold);
            font-weight: 700;
            font-style: italic;
            margin-top: 6px;
            font-size: 16px;
            letter-spacing: 0.5px;
        }

        .welcome-description {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.7;
            margin-bottom: 24px;
            margin-top: 16px;
            padding: 16px;
            background: var(--bg-input);
            border-radius: var(--radius-md);
            border-left: 3px solid var(--gold);
            text-align: left;
            animation: slideUp 0.6s ease-out 0.4s both;
        }

        .btn-continue {
            width: 100%;
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: var(--bg-dark);
            border: none;
            border-radius: var(--radius-md);
            padding: 16px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            animation: slideUp 0.6s ease-out 0.5s both;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: inherit;
        }

        .btn-continue:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(212, 175, 55, 0.5);
        }

        .btn-continue i {
            transition: var(--transition);
        }

        .btn-continue:hover i {
            transform: translateX(4px);
        }

        .info-card {
            margin-top: 20px;
            padding: 16px;
            background: var(--bg-input);
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
            animation: slideUp 0.6s ease-out 0.6s both;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 0;
            font-size: 13px;
            color: var(--text-muted);
        }

        .info-item:not(:last-child) {
            border-bottom: 1px solid var(--border);
        }

        .info-item i {
            color: var(--gold);
            font-size: 14px;
            width: 20px;
            text-align: center;
        }

        .slides-container {
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            aspect-ratio: 16/9;
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.15), rgba(212, 175, 55, 0.05));
        }

        .slides-container::-webkit-scrollbar { display: none; }

        .slide {
            min-width: 100%;
            scroll-snap-align: start;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .slide img,
        .slide video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .slide-content {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 20px;
            background: linear-gradient(to top, rgba(2, 6, 23, 0.9), transparent);
            color: white;
            text-align: left;
        }

        .slide-content h3 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .slide-content p {
            font-size: 13px;
            opacity: 0.9;
        }

        .slide-dots {
            display: flex;
            justify-content: center;
            gap: 6px;
            padding: 12px 0;
            background: var(--bg-card);
        }

        .slide-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--border);
            transition: var(--transition);
        }

        .slide-dot.active {
            background: var(--gold);
            width: 24px;
            border-radius: 4px;
        }

        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--bg-input);
            border-top-color: var(--gold);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { color: var(--text-muted); font-size: 14px; }

        @media (max-width: 480px) {
            .welcome-title .user-name { font-size: 26px; }
            .welcome-title .greeting { font-size: 12px; letter-spacing: 2px; }
            .welcome-body { padding: 0 20px 24px; }
            .profile-avatar { width: 100px; height: 100px; font-size: 40px; }
            .avatar-wrapper { padding: 0 20px; }
        }

        .confetti {
            position: fixed;
            top: -10px;
            width: 10px;
            height: 10px;
            background: var(--gold);
            animation: confettiFall 3s linear infinite;
            z-index: 9999;
            pointer-events: none;
            opacity: 0.7;
        }

        @keyframes confettiFall {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }
    </style>
</head>
<body>
    
    <div class="welcome-container" id="welcomeContainer">
        <div class="welcome-card" id="loadingCard">
            <div style="padding: 60px 20px;">
                <div class="loading-container">
                    <div class="loading-spinner"></div>
                    <div class="loading-text">Inapakia...</div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="hosting-config.js"></script>
    <script src="user-auth.js"></script>
    
    <script>
        // ============================================
        // WELCOME PAGE
        // ============================================
        
        document.addEventListener('DOMContentLoaded', async function() {
            console.log('👋 Welcome page - Initializing');
            
            // Subiri supabaseClient init
            setTimeout(async () => {
                const user = getCurrentUser();
                
                if (!user) {
                    window.location.href = 'index.html';
                    return;
                }
                
                console.log('User:', user.jina);
                
                const welcome = await loadWelcome();
                const slides = welcome ? await loadWelcomeSlides(welcome.id) : [];
                
                renderWelcome(user, welcome, slides);
            }, 200);
        });
        
        function generateInitials(jina) {
            if (!jina || typeof jina !== 'string') return '??';
            
            const cleanedJina = jina.trim().replace(/\s+/g, ' ');
            const names = cleanedJina.split(' ');
            
            if (names.length >= 2) {
                return (names[0].charAt(0) + names[1].charAt(0)).toUpperCase();
            }
            
            if (names.length === 1 && names[0].length >= 2) {
                return names[0].substring(0, 2).toUpperCase();
            }
            
            return '??';
        }
        
        function renderWelcome(user, welcome, slides) {
            const container = document.getElementById('welcomeContainer');
            
            const hasProfilePicture = user.profile_picture && 
                                     user.profile_picture !== 'null' && 
                                     user.profile_picture !== 'undefined' && 
                                     user.profile_picture.trim() !== '';
            
            const initials = generateInitials(user.jina);
            const firstName = user.jina ? user.jina.split(' ')[0] : 'User';
            
            let mediaHtml = '';
            let slidesHtml = '';
            let hasMedia = false;
            
            if (slides && slides.length > 0) {
                hasMedia = true;
                slidesHtml = `
                    <div class="slides-container" id="slidesContainer">
                        ${slides.map((slide, index) => `
                            <div class="slide" data-index="${index}">
                                ${slide.image_file ? `<img src="${slide.image_file}" alt="${slide.title || 'Slide'}">` : ''}
                                ${slide.video_file ? `<video src="${slide.video_file}" autoplay muted loop></video>` : ''}
                                ${(slide.title || slide.description) ? `
                                    <div class="slide-content">
                                        ${slide.title ? `<h3>${slide.title}</h3>` : ''}
                                        ${slide.description ? `<p>${slide.description}</p>` : ''}
                                    </div>
                                ` : ''}
                            </div>
                        `).join('')}
                    </div>
                    <div class="slide-dots" id="slideDots">
                        ${slides.map((_, i) => `<div class="slide-dot ${i === 0 ? 'active' : ''}"></div>`).join('')}
                    </div>
                `;
            }
            else if (welcome?.video_file) {
                hasMedia = true;
                mediaHtml = `
                    <div class="welcome-media">
                        <video src="${welcome.video_file}" autoplay muted loop></video>
                    </div>
                `;
            }
            else if (welcome?.image_file) {
                hasMedia = true;
                mediaHtml = `
                    <div class="welcome-media">
                        <img src="${welcome.image_file}" alt="Welcome">
                    </div>
                `;
            }
            
            const avatarHtml = hasProfilePicture
                ? `<div class="profile-avatar"><img src="${user.profile_picture}" alt="${user.jina}" onerror="this.parentElement.innerHTML='${initials}'"></div>`
                : `<div class="profile-avatar">${initials}</div>`;
            
            const welcomeTitleHtml = `
                <h1 class="welcome-title">
                    <span class="greeting">Karibu</span>
                    <span class="user-name">${firstName.toUpperCase()}</span>
                </h1>
            `;
            
            const subtitleHtml = welcome?.subtitle 
                ? `<p class="welcome-subtitle">${welcome.subtitle}</p>`
                : `<p class="welcome-subtitle">
                    Kwaya ya Vijana ya
                    <span class="church-name">Mtakatifu Carlo Acutis</span>
                   </p>`;
            
            const descriptionHtml = welcome?.description 
                ? `<div class="welcome-description">${welcome.description}</div>`
                : '';
            
            const buttonText = welcome?.button_text || 'Ingia Sasa';
            const buttonLink = welcome?.button_link || 'home.html';
            const autoRedirect = welcome?.auto_redirect_seconds || 0;
            
            const html = `
                <div class="welcome-card">
                    ${slidesHtml || mediaHtml}
                    
                    <div class="avatar-wrapper ${hasMedia ? 'with-media' : ''}">
                        ${avatarHtml}
                    </div>
                    
                    <div class="welcome-body">
                        ${welcomeTitleHtml}
                        ${subtitleHtml}
                        ${descriptionHtml}
                        
                        <button class="btn-continue" id="continueBtn">
                            <i class="fas fa-arrow-right"></i>
                            ${buttonText}
                        </button>
                        
                        ${(user.parokia || user.jimbo || user.phone) ? `
                            <div class="info-card">
                                ${user.parokia ? `
                                    <div class="info-item">
                                        <i class="fas fa-church"></i>
                                        <span>${user.parokia}</span>
                                    </div>
                                ` : ''}
                                ${user.jimbo ? `
                                    <div class="info-item">
                                        <i class="fas fa-map-marker-alt"></i>
                                        <span>${user.jimbo}</span>
                                    </div>
                                ` : ''}
                                ${user.phone ? `
                                    <div class="info-item">
                                        <i class="fas fa-phone"></i>
                                        <span>${user.phone}</span>
                                    </div>
                                ` : ''}
                            </div>
                        ` : ''}
                    </div>
                </div>
            `;
            
            container.innerHTML = html;
            
            setupWelcomeEvents(buttonLink, autoRedirect, slides.length);
        }
        
        function setupWelcomeEvents(buttonLink, autoRedirect, slidesCount) {
            const btn = document.getElementById('continueBtn');
            if (btn) {
                btn.addEventListener('click', function() {
                    window.location.href = buttonLink;
                });
            }
            
            if (slidesCount > 0) {
                const slidesContainer = document.getElementById('slidesContainer');
                const dots = document.querySelectorAll('.slide-dot');
                
                if (slidesContainer) {
                    slidesContainer.addEventListener('scroll', function() {
                        const scrollLeft = slidesContainer.scrollLeft;
                        const slideWidth = slidesContainer.clientWidth;
                        const activeIndex = Math.round(scrollLeft / slideWidth);
                        
                        dots.forEach((dot, i) => {
                            dot.classList.toggle('active', i === activeIndex);
                        });
                    });
                }
            }
            
            if (autoRedirect > 0) {
                setTimeout(() => {
                    window.location.href = buttonLink;
                }, autoRedirect * 1000);
            }
            
            if (localStorage.getItem('kmca_welcome_shown') !== '1') {
                createConfetti();
                localStorage.setItem('kmca_welcome_shown', '1');
            }
        }
        
        function createConfetti() {
            const colors = ['#d4af37', '#f0d060', '#10b981', '#3b82f6', '#ec4899'];
            
            for (let i = 0; i < 30; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + '%';
                    confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
                    confetti.style.animationDelay = (Math.random() * 2) + 's';
                    
                    document.body.appendChild(confetti);
                    
                    setTimeout(() => confetti.remove(), 5000);
                }, i * 50);
            }
        }
    </script>
</body>
</html>
