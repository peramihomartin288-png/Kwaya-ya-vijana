<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#020617">
    <title>Bible Verse - KMCA</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="user-icon-180.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="KMCA">
    <link rel="icon" href="favicon.ico">
    
    <style>
        :root {
            --primary: #d4af37;
            --primary-dark: #b8962e;
            --primary-light: #f0d060;
            --bg-dark: #020617;
            --bg-card: #0f172a;
            --bg-input: #1e293b;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --error: #ef4444;
            --success: #10b981;
            --warning: #f59e0b;
            --info: #3b82f6;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --shadow: 0 4px 20px rgba(0,0,0,0.2);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="light"] {
            --bg-dark: #f8fafc;
            --bg-card: #ffffff;
            --bg-input: #f1f5f9;
            --text-light: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            overflow-x: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-dark);
            color: var(--text-light);
            line-height: 1.6;
            min-height: 100vh;
            padding-bottom: 40px;
            transition: background 0.3s, color 0.3s;
        }

        /* ============ HEADER ============ */
        .page-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 100;
            box-shadow: var(--shadow);
        }

        .back-btn {
            width: 42px;
            height: 42px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            color: var(--text-light);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: var(--transition);
            text-decoration: none;
        }

        .back-btn:hover {
            background: var(--primary);
            color: var(--bg-dark);
            transform: translateX(-2px);
        }

        .page-title {
            font-size: 18px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .page-title i {
            color: var(--primary);
        }

        .header-spacer {
            width: 42px;
        }

        /* ============ MAIN ============ */
        .main-content {
            max-width: 700px;
            margin: 0 auto;
            padding: 76px 12px 20px;
        }

        /* ============ LOADING ============ */
        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 80px 20px;
            gap: 16px;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--bg-input);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            color: var(--text-muted);
            font-size: 14px;
        }

        /* ============ BIBLE CARD ============ */
        .bible-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            overflow: hidden;
            animation: slideUp 0.5s ease-out;
            margin-bottom: 16px;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ============ BIBLE HEADER ============ */
        .bible-header {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.15), rgba(16, 185, 129, 0.05));
            padding: 32px 24px;
            text-align: center;
            position: relative;
            overflow: hidden;
            border-bottom: 1px solid var(--border);
        }

        .bible-header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.15) 0%, transparent 70%);
            animation: pulseGlow 4s ease-in-out infinite;
        }

        @keyframes pulseGlow {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }

        .bible-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 16px;
            background: linear-gradient(135deg, #10b981, #059669);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            color: white;
            position: relative;
            z-index: 1;
            box-shadow: 0 10px 30px rgba(16, 185, 129, 0.4);
            animation: iconPulse 3s ease-in-out infinite;
        }

        @keyframes iconPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .bible-title {
            font-size: 24px;
            font-weight: 900;
            color: var(--text-light);
            margin-bottom: 8px;
            position: relative;
            z-index: 1;
            letter-spacing: -0.5px;
            line-height: 1.3;
        }

        .bible-date {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.3);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            color: #10b981;
            font-weight: 700;
            position: relative;
            z-index: 1;
        }

        /* ============ BIBLE BODY ============ */
        .bible-body {
            padding: 24px;
        }

        /* ============ VERSE TEXT ============ */
        .verse-box {
            background: var(--bg-input);
            border-left: 4px solid #10b981;
            border-radius: var(--radius-md);
            padding: 24px;
            margin-bottom: 20px;
            position: relative;
            animation: slideUp 0.5s ease-out 0.1s both;
        }

        .verse-box::before {
            content: '"';
            position: absolute;
            top: -10px;
            left: 16px;
            font-size: 60px;
            color: #10b981;
            opacity: 0.3;
            font-family: Georgia, serif;
            line-height: 1;
        }

        .verse-text {
            font-size: 18px;
            font-style: italic;
            line-height: 1.8;
            color: var(--text-light);
            white-space: pre-wrap;
            word-wrap: break-word;
            overflow-wrap: break-word;
            position: relative;
            z-index: 1;
            padding-top: 12px;
        }

        /* ============ REFERENCE ============ */
        .verse-reference {
            text-align: center;
            font-size: 18px;
            font-weight: 900;
            color: #10b981;
            margin-bottom: 20px;
            letter-spacing: 0.5px;
            animation: slideUp 0.5s ease-out 0.2s both;
        }

        .verse-reference::before {
            content: '— ';
            color: var(--text-muted);
        }

        /* ============ FUNZO BOX ============ */
        .funzo-box {
            background: rgba(212, 175, 55, 0.08);
            border-left: 4px solid var(--primary);
            border-radius: var(--radius-md);
            padding: 20px;
            animation: slideUp 0.5s ease-out 0.3s both;
        }

        .funzo-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .funzo-icon {
            width: 32px;
            height: 32px;
            background: rgba(212, 175, 55, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: var(--primary);
            flex-shrink: 0;
        }

        .funzo-title {
            font-size: 13px;
            font-weight: 800;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .funzo-text {
            font-size: 15px;
            line-height: 1.8;
            color: var(--text-light);
            white-space: pre-wrap;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        /* ============ ACTIONS ============ */
        .bible-actions {
            display: flex;
            border-top: 1px solid var(--border);
        }

        .bible-action {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            transition: var(--transition);
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
        }

        .bible-action:hover {
            background: var(--bg-input);
            color: var(--text-light);
        }

        .bible-action.liked {
            color: var(--error);
        }

        .bible-action.liked i {
            animation: heartBeat 0.5s;
        }

        @keyframes heartBeat {
            0%, 25%, 50%, 75%, 100% { transform: scale(1); }
            40% { transform: scale(1.3); }
            60% { transform: scale(1.2); }
        }

        /* ============ COMMENTS MODAL ============ */
        .comments-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 5000;
            display: none;
            align-items: flex-end;
            justify-content: center;
            backdrop-filter: blur(8px);
        }

        .comments-modal.active {
            display: flex;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .comments-modal-content {
            background: var(--bg-card);
            border-radius: 20px 20px 0 0;
            width: 100%;
            max-width: 700px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            animation: slideUpModal 0.3s ease-out;
        }

        @keyframes slideUpModal {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .comments-modal-header {
            padding: 18px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .comments-modal-header h3 {
            font-size: 17px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .comments-modal-header h3 i {
            color: var(--primary);
        }

        .comments-modal-close {
            width: 36px;
            height: 36px;
            background: var(--bg-input);
            border: none;
            border-radius: 50%;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }

        .comments-modal-close:hover {
            background: var(--error);
            color: white;
            transform: rotate(90deg);
        }

        .comments-modal-body {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
        }

        .comments-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .comment-item {
            display: flex;
            gap: 12px;
            animation: slideUp 0.3s ease-out;
        }

        .comment-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 800;
            color: var(--bg-dark);
            flex-shrink: 0;
            overflow: hidden;
        }

        .comment-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .comment-body {
            flex: 1;
            min-width: 0;
        }

        .comment-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 4px;
        }

        .comment-author {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-light);
        }

        .comment-time {
            font-size: 11px;
            color: var(--text-muted);
        }

        .comment-text {
            font-size: 14px;
            color: var(--text-light);
            line-height: 1.5;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .no-comments {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
        }

        .no-comments i {
            font-size: 48px;
            color: var(--border);
            display: block;
            margin-bottom: 12px;
        }

        .comments-modal-footer {
            padding: 12px 20px 20px;
            border-top: 1px solid var(--border);
        }

        .comment-input-container {
            display: flex;
            gap: 10px;
        }

        .comment-input {
            flex: 1;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 12px 16px;
            color: var(--text-light);
            font-size: 14px;
            outline: none;
            font-family: inherit;
        }

        .comment-input:focus {
            border-color: var(--primary);
        }

        .btn-send-comment {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: var(--bg-dark);
            border: none;
            border-radius: var(--radius-md);
            padding: 12px 18px;
            font-size: 16px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-send-comment:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(212, 175, 55, 0.4);
        }

        .login-prompt {
            background: var(--bg-input);
            border: 1px dashed var(--border);
            border-radius: var(--radius-md);
            padding: 20px;
            text-align: center;
        }

        .login-prompt i {
            font-size: 32px;
            color: var(--primary);
            margin-bottom: 10px;
        }

        .login-prompt p {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 14px;
        }

        .btn-login-prompt {
            background: var(--primary);
            color: var(--bg-dark);
            border: none;
            border-radius: var(--radius-md);
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            font-family: inherit;
        }

        /* ============ SHARE MODAL ============ */
        .share-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 5000;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            backdrop-filter: blur(5px);
            animation: fadeIn 0.2s;
        }

        .share-modal-content {
            background: var(--bg-card);
            border-radius: 20px 20px 0 0;
            width: 100%;
            max-width: 500px;
            padding: 24px 20px;
            animation: slideUpModal 0.3s ease-out;
        }

        .share-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .share-modal-header h3 {
            font-size: 18px;
            font-weight: 800;
        }

        .share-modal-close {
            width: 36px;
            height: 36px;
            background: var(--bg-input);
            border: none;
            border-radius: 50%;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 16px;
        }

        .share-options-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .share-option {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding: 16px 8px;
            background: var(--bg-input);
            border-radius: var(--radius-md);
            border: none;
            color: var(--text-light);
            text-decoration: none;
            cursor: pointer;
            transition: var(--transition);
            font-family: inherit;
        }

        .share-option:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        .share-option i { font-size: 28px; }
        .share-option span { font-size: 12px; font-weight: 600; }

        .share-option.whatsapp i { color: #25D366; }
        .share-option.facebook i { color: #1877F2; }
        .share-option.twitter i { color: #1DA1F2; }
        .share-option.telegram i { color: #0088cc; }
        .share-option.copy i { color: var(--primary); }

        .share-url-preview input {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 12px;
            color: var(--text-muted);
            font-size: 12px;
            outline: none;
        }

        /* ============ EMPTY STATE ============ */
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-muted);
        }

        .empty-state i {
            font-size: 72px;
            color: var(--border);
            margin-bottom: 20px;
        }

        .empty-state h3 {
            font-size: 20px;
            font-weight: 800;
            color: var(--text-light);
            margin-bottom: 10px;
        }

        .empty-state p {
            font-size: 14px;
            margin-bottom: 20px;
        }

        .btn-home {
            background: var(--primary);
            color: var(--bg-dark);
            border: none;
            border-radius: var(--radius-md);
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            font-family: inherit;
        }

        .btn-home:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(212, 175, 55, 0.4);
        }

        /* ============ TOAST ============ */
        .kmca-toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: var(--success);
            color: white;
            padding: 14px 24px;
            border-radius: var(--radius-md);
            font-size: 14px;
            font-weight: 600;
            z-index: 99999;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 10px;
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            max-width: 90%;
        }

        /* ============ RESPONSIVE ============ */
        @media (max-width: 480px) {
            .main-content {
                padding: 76px 8px 20px;
            }
            
            .bible-title {
                font-size: 20px;
            }
            
            .bible-body {
                padding: 20px 16px;
            }
            
            .bible-header {
                padding: 24px 16px;
            }
            
            .verse-text {
                font-size: 16px;
            }
            
            .verse-box {
                padding: 20px 16px;
            }
        }
    </style>
</head>
<body>
    
    <!-- ============ HEADER ============ -->
    <header class="page-header">
        <a href="home.html" class="back-btn" id="backBtn">
            <i class="fas fa-arrow-left"></i>
        </a>
        <div class="page-title">
            <i class="fas fa-bible"></i>
            Bible Verse
        </div>
        <div class="header-spacer"></div>
    </header>
    
    <!-- ============ MAIN CONTENT ============ -->
    <main class="main-content" id="mainContent">
        <div class="loading-container">
            <div class="loading-spinner"></div>
            <div class="loading-text">Inapakia...</div>
        </div>
    </main>
    
    <!-- ============ SCRIPTS ============ -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="user-auth.js"></script>
    <script src="dark-mode.js"></script>
    
    <script>
        // ============================================
        // BIBLE PAGE - bible.html
        // ============================================
        
        let currentUser = null;
        let settings = {};
        let bibleData = null;
        let bibleId = '';
        let comments = [];
        
        document.addEventListener('DOMContentLoaded', async function() {
            console.log('Bible page - Initializing');
            
            currentUser = getCurrentUser();
            
            const params = new URLSearchParams(window.location.search);
            bibleId = params.get('id');
            
            if (!bibleId) {
                renderError('Verse haipatikani', 'Link si sahihi');
                return;
            }
            
            settings = await loadSettings();
            await loadVerse();
            await loadComments();
            renderVerse();
            setupEvents();
        });
        
        // ============ LOAD SETTINGS ============
        async function loadSettings() {
            try {
                const { data } = await supabaseClient
                    .from('app_settings')
                    .select('setting_key, setting_value');
                
                const obj = {};
                (data || []).forEach(s => {
                    obj[s.setting_key] = s.setting_value;
                });
                
                return obj;
            } catch (e) {
                return {};
            }
        }
        
        // ============ LOAD VERSE ============
        async function loadVerse() {
            try {
                const { data, error } = await supabaseClient
                    .from('bible_verses')
                    .select('*')
                    .eq('id', bibleId)
                    .single();
                
                if (error || !data) {
                    renderError('Verse haipatikani', 'Huenda imefutwa au link si sahihi');
                    return;
                }
                
                bibleData = data;
                console.log('Verse loaded:', data);
                
            } catch (e) {
                console.error('Load verse error:', e);
                renderError('Imeshindikana', 'Tafadhali jaribu tena');
            }
        }
        
        // ============ LOAD COMMENTS ============
        async function loadComments() {
            try {
                const { data } = await supabaseClient
                    .from('comments')
                    .select('*, users(jina, profile_picture)')
                    .eq('content_type', 'bible')
                    .eq('content_id', bibleId)
                    .order('created_at', { ascending: false })
                    .limit(50);
                
                comments = data || [];
            } catch (e) {
                comments = [];
            }
        }

                canvas.width = 1080;

                gradient.addColorStop(0, '#020617');
                gradient.addColorStop(0.5, '#0f172a');
                gradient.addColorStop(1, '#020617');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.fillStyle = 'rgba(16, 185, 129, 0.08)';
                ctx.beginPath();
                ctx.arc(200, 300, 400, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.beginPath();
                ctx.arc(900, 1600, 350, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
                roundRect(ctx, 60, 200, canvas.width - 120, canvas.height - 400, 30);
                ctx.fill();
                
                ctx.strokeStyle = '#10b981';
                ctx.lineWidth = 3;
                roundRect(ctx, 60, 200, canvas.width - 120, canvas.height - 400, 30);
                ctx.stroke();
                
                let yPos = 300;
                
                ctx.font = '80px -apple-system, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('📖', canvas.width / 2, yPos);
                yPos += 90;
                
                ctx.fillStyle = '#d4af37';
                ctx.font = 'bold 42px -apple-system, sans-serif';
                ctx.textAlign = 'center';
                const titleY = wrapText(ctx, bibleData.kichwa, canvas.width / 2, yPos, canvas.width - 200, 50);

                ctx.fillStyle = '#f8fafc';
                ctx.font = 'italic 32px -apple-system, sans-serif';
                ctx.textAlign = 'left';
                const verseY = wrapText(ctx, '"' + bibleData.verse_text + '"', 120, yPos, canvas.width - 240, 48);
                yPos = verseY + 30;
                
                if (bibleData.reference) {
                    ctx.fillStyle = '#10b981';
                    ctx.font = 'bold 36px -apple-system, sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText('— ' + bibleData.reference, canvas.width / 2, yPos);
                    yPos += 60;
                }
                
                if (bibleData.funzo) {
                    yPos += 20;
                    ctx.fillStyle = '#d4af37';
                    ctx.font = 'bold 28px -apple-system, sans-serif';
                    ctx.textAlign = 'left';
                    ctx.fillText('💡 FUNZO', 120, yPos);

                ctx.fillStyle = 'rgba(212, 175, 55, 0.9)';

                ctx.fillStyle = '#d4af37';
                ctx.font = 'bold 42px -apple-system, sans-serif';

        // ============ CANVAS HELPERS ============
        function roundRect(ctx, x, y, width, height, radius) {
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.lineTo(x + width - radius, y);
            ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
            ctx.lineTo(x + width, y + height - radius);
            ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
            ctx.lineTo(x + radius, y + height);
            ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
            ctx.lineTo(x, y + radius);
            ctx.quadraticCurveTo(x, y, x + radius, y);
            ctx.closePath();
        }
        
        function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
            const paragraphs = text.split('\n');
            let currentY = y;
            
            paragraphs.forEach(paragraph => {
                const words = paragraph.split(' ');
                let line = '';
                
                words.forEach(word => {
                    const testLine = line + word + ' ';
                    const metrics = ctx.measureText(testLine);
                    
                    if (metrics.width > maxWidth && line !== '') {
                        ctx.fillText(line, x, currentY);
                        line = word + ' ';
                        currentY += lineHeight;
                    } else {
                        line = testLine;
                    }
                });
                
                ctx.fillText(line, x, currentY);
                currentY += lineHeight;
            });
            
            return currentY;
        }

        // ============ HELPERS ============
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function generateInitials(jina) {
            if (!jina) return '??';
            const cleaned = jina.trim().replace(/\s+/g, ' ');
            const names = cleaned.split(' ');
            
            if (names.length >= 2) {
                return (names[0].charAt(0) + names[1].charAt(0)).toUpperCase();
            }
            if (names.length === 1 && names[0].length >= 2) {
                return names[0].substring(0, 2).toUpperCase();
            }
            return '??';
        }
        
        function getTimeAgo(dateString) {
            if (!dateString) return '';
            const date = new Date(dateString);
            const now = new Date();
            const seconds = Math.floor((now - date) / 1000);
            
            if (seconds < 60) return 'Sasa hivi';
            if (seconds < 3600) return Math.floor(seconds / 60) + 'm';
            if (seconds < 86400) return Math.floor(seconds / 3600) + 'h';
            if (seconds < 604800) return Math.floor(seconds / 86400) + 'd';
            
            return date.toLocaleDateString('sw-TZ', { day: 'numeric', month: 'short' });
        }
    </script>
