<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#020617">
    <title>Mtakatifu - KMCA</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="user-icon-180.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="KMCA">
    <link rel="icon" href="favicon.ico">
    
    <style>
        :root {
            --primary: #d4af37;
            --primary-dark: #b8962e;
            --primary-light: #f0d060;
            --bg-dark: #020617;
            --bg-card: #0f172a;
            --bg-input: #1e293b;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --error: #ef4444;
            --success: #10b981;
            --warning: #f59e0b;
            --info: #3b82f6;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --shadow: 0 4px 20px rgba(0,0,0,0.2);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="light"] {
            --bg-dark: #f8fafc;
            --bg-card: #ffffff;
            --bg-input: #f1f5f9;
            --text-light: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            overflow-x: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-dark);
            color: var(--text-light);
            line-height: 1.6;
            min-height: 100vh;
            padding-bottom: 40px;
            transition: background 0.3s, color 0.3s;
        }

        /* ============ HEADER ============ */
        .page-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 100;
            box-shadow: var(--shadow);
        }

        .back-btn {
            width: 42px;
            height: 42px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            color: var(--text-light);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: var(--transition);
            text-decoration: none;
        }

        .back-btn:hover {
            background: var(--primary);
            color: var(--bg-dark);
            transform: translateX(-2px);
        }

        .page-title {
            font-size: 18px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .page-title i {
            color: var(--primary);
        }

        .header-spacer {
            width: 42px;
        }

        /* ============ MAIN CONTENT ============ */
        .main-content {
            max-width: 700px;
            margin: 0 auto;
            padding: 76px 12px 20px;
        }

        /* ============ LOADING ============ */
        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 80px 20px;
            gap: 16px;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--bg-input);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            color: var(--text-muted);
            font-size: 14px;
        }

        /* ============ SAINT CARD ============ */
        .saint-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            overflow: hidden;
            animation: slideUp 0.5s ease-out;
            margin-bottom: 16px;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ============ SAINT IMAGE ============ */
        .saint-image {
            position: relative;
            width: 100%;
            aspect-ratio: 4/3;
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.15), rgba(212, 175, 55, 0.05));
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .saint-image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        .saint-image-placeholder {
            font-size: 96px;
            color: var(--primary);
            opacity: 0.3;
        }

        /* ============ WATERMARK ============ */
        .watermark {
            position: absolute;
            bottom: 16px;
            right: 16px;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(10px);
            padding: 8px 14px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            pointer-events: none;
            z-index: 5;
            max-width: 220px;
        }

        .watermark-logo {
            width: 32px;
            height: 32px;
            object-fit: contain;
            flex-shrink: 0;
        }

        .watermark-text {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
        }

        .watermark-text span:first-child {
            font-size: 9px;
            color: #f0d060;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            letter-spacing: 0.3px;
            line-height: 1.2;
        }

        .watermark-text span:last-child {
            font-size: 12px;
            color: #d4af37;
            font-weight: 900;
            letter-spacing: 1.5px;
            line-height: 1.2;
        }

        /* ============ SAINT HEADER ============ */
        .saint-header {
            padding: 24px 24px 20px;
            text-align: center;
            border-bottom: 1px solid var(--border);
        }

        .saint-title {
            font-size: 26px;
            font-weight: 900;
            color: var(--text-light);
            margin-bottom: 8px;
            letter-spacing: -0.5px;
            line-height: 1.3;
        }

        .saint-date {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(212, 175, 55, 0.12);
            border: 1px solid rgba(212, 175, 55, 0.3);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            color: var(--primary);
            font-weight: 700;
        }

        .saint-date i {
            font-size: 12px;
        }

        /* ============ SAINT BODY ============ */
        .saint-body {
            padding: 24px;
        }

        /* ============ SECTIONS ============ */
        .saint-section {
            margin-bottom: 24px;
            animation: slideUp 0.5s ease-out;
        }

        .saint-section:last-child {
            margin-bottom: 0;
        }

        .saint-section-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .saint-section-icon {
            width: 36px;
            height: 36px;
            background: rgba(212, 175, 55, 0.15);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: var(--primary);
            flex-shrink: 0;
        }

        .saint-section-title {
            font-size: 15px;
            font-weight: 800;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .saint-section-content {
            font-size: 15px;
            color: var(--text-light);
            line-height: 1.8;
            white-space: pre-wrap;
            word-wrap: break-word;
            overflow-wrap: break-word;
            padding-left: 46px;
        }

        /* ============ SPECIAL SECTIONS ============ */
        .saint-section.sala .saint-section-icon {
            background: rgba(59, 130, 246, 0.15);
            color: #3b82f6;
        }

        .saint-section.sala .saint-section-content {
            padding: 16px;
            padding-left: 46px;
            background: rgba(59, 130, 246, 0.05);
            border-left: 3px solid #3b82f6;
            border-radius: var(--radius-md);
            margin-left: 46px;
            padding-left: 16px;
            font-style: italic;
        }

        .saint-section.miujiza .saint-section-icon {
            background: rgba(168, 85, 247, 0.15);
            color: #a855f7;
        }

        .saint-section.miujiza .saint-section-content {
            padding: 16px;
            padding-left: 46px;
            background: rgba(168, 85, 247, 0.05);
            border-left: 3px solid #a855f7;
            border-radius: var(--radius-md);
            margin-left: 46px;
            padding-left: 16px;
        }

        /* ============ ACTIONS ============ */
        .saint-actions {
            display: flex;
            border-top: 1px solid var(--border);
        }

        .saint-action {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            transition: var(--transition);
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
        }

        .saint-action:hover {
            background: var(--bg-input);
            color: var(--text-light);
        }

        .saint-action.liked {
            color: var(--error);
        }

        .saint-action.liked i {
            animation: heartBeat 0.5s;
        }

        @keyframes heartBeat {
            0%, 100% { transform: scale(1); }
            25% { transform: scale(1.3); }
            50% { transform: scale(1); }
            75% { transform: scale(1.2); }
        }

        /* ============ COMMENTS MODAL ============ */
        .comments-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 5000;
            display: none;
            align-items: flex-end;
            justify-content: center;
            backdrop-filter: blur(8px);
        }

        .comments-modal.active {
            display: flex;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .comments-modal-content {
            background: var(--bg-card);
            border-radius: 20px 20px 0 0;
            width: 100%;
            max-width: 700px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            animation: slideUpModal 0.3s ease-out;
        }

        @keyframes slideUpModal {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .comments-modal-header {
            padding: 18px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .comments-modal-header h3 {
            font-size: 17px;
            font-weight: 800;
            color: var(--text-light);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .comments-modal-header h3 i {
            color: var(--primary);
        }

        .comments-modal-close {
            width: 36px;
            height: 36px;
            background: var(--bg-input);
            border: none;
            border-radius: 50%;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }

        .comments-modal-close:hover {
            background: var(--error);
            color: white;
            transform: rotate(90deg);
        }

        .comments-modal-body {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
        }

        .comments-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .comment-item {
            display: flex;
            gap: 12px;
            animation: slideUp 0.3s ease-out;
        }

        .comment-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 800;
            color: var(--bg-dark);
            flex-shrink: 0;
            overflow: hidden;
        }

        .comment-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .comment-body {
            flex: 1;
            min-width: 0;
        }

        .comment-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 4px;
        }

        .comment-author {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-light);
        }

        .comment-time {
            font-size: 11px;
            color: var(--text-muted);
        }

        .comment-text {
            font-size: 14px;
            color: var(--text-light);
            line-height: 1.5;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .no-comments {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
            font-size: 14px;
        }

        .no-comments i {
            font-size: 48px;
            color: var(--border);
            display: block;
            margin-bottom: 12px;
        }

        .comments-modal-footer {
            padding: 12px 20px 20px;
            border-top: 1px solid var(--border);
        }

        .comment-input-container {
            display: flex;
            gap: 10px;
        }

        .comment-input {
            flex: 1;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 12px 16px;
            color: var(--text-light);
            font-size: 14px;
            outline: none;
            font-family: inherit;
            transition: var(--transition);
        }

        .comment-input:focus {
            border-color: var(--primary);
        }

        .btn-send-comment {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: var(--bg-dark);
            border: none;
            border-radius: var(--radius-md);
            padding: 12px 18px;
            font-size: 16px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-send-comment:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(212, 175, 55, 0.4);
        }

        .btn-send-comment:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .login-prompt {
            background: var(--bg-input);
            border: 1px dashed var(--border);
            border-radius: var(--radius-md);
            padding: 20px;
            text-align: center;
        }

        .login-prompt i {
            font-size: 32px;
            color: var(--primary);
            margin-bottom: 10px;
        }

        .login-prompt p {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 14px;
        }

        .btn-login-prompt {
            background: var(--primary);
            color: var(--bg-dark);
            border: none;
            border-radius: var(--radius-md);
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            font-family: inherit;
        }

        .btn-login-prompt:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(212, 175, 55, 0.4);
        }

        /* ============ SHARE MODAL ============ */
        .share-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 5000;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            backdrop-filter: blur(5px);
            animation: fadeIn 0.2s;
        }

        .share-modal-content {
            background: var(--bg-card);
            border-radius: 20px 20px 0 0;
            width: 100%;
            max-width: 500px;
            padding: 24px 20px;
            animation: slideUpModal 0.3s ease-out;
        }

        .share-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .share-modal-header h3 {
            font-size: 18px;
            font-weight: 800;
            color: var(--text-light);
        }

        .share-modal-close {
            width: 36px;
            height: 36px;
            background: var(--bg-input);
            border: none;
            border-radius: 50%;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 16px;
        }

        .share-options-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .share-option {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding: 16px 8px;
            background: var(--bg-input);
            border-radius: var(--radius-md);
            border: none;
            color: var(--text-light);
            text-decoration: none;
            cursor: pointer;
            transition: var(--transition);
            font-family: inherit;
        }

        .share-option:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        .share-option i { font-size: 28px; }
        .share-option span { font-size: 12px; font-weight: 600; }

        .share-option.whatsapp i { color: #25D366; }
        .share-option.facebook i { color: #1877F2; }
        .share-option.twitter i { color: #1DA1F2; }
        .share-option.telegram i { color: #0088cc; }
        .share-option.copy i { color: var(--primary); }

        .share-url-preview input {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 12px;
            color: var(--text-muted);
            font-size: 12px;
            outline: none;
        }

        /* ============ EMPTY STATE ============ */
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-muted);
        }

        .empty-state i {
            font-size: 72px;
            color: var(--border);
            margin-bottom: 20px;
        }

        .empty-state h3 {
            font-size: 20px;
            font-weight: 800;
            color: var(--text-light);
            margin-bottom: 10px;
        }

        .empty-state p {
            font-size: 14px;
            margin-bottom: 20px;
        }

        .btn-home {
            background: var(--primary);
            color: var(--bg-dark);
            border: none;
            border-radius: var(--radius-md);
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            font-family: inherit;
        }

        .btn-home:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(212, 175, 55, 0.4);
        }

        /* ============ TOAST ============ */
        .kmca-toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: var(--success);
            color: white;
            padding: 14px 24px;
            border-radius: var(--radius-md);
            font-size: 14px;
            font-weight: 600;
            z-index: 99999;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 10px;
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            max-width: 90%;
        }

        /* ============ RESPONSIVE ============ */
        @media (max-width: 480px) {
            .main-content {
                padding: 76px 8px 20px;
            }
            
            .saint-title {
                font-size: 22px;
            }
            
            .saint-body {
                padding: 20px 16px;
            }
            
            .saint-header {
                padding: 20px 16px 16px;
            }
            
            .saint-section-content {
                padding-left: 0;
                margin-left: 0;
            }
            
            .saint-section.sala .saint-section-content,
            .saint-section.miujiza .saint-section-content {
                padding-left: 12px;
                margin-left: 0;
            }
        }
    </style>
</head>
<body>
    
    <!-- ============ HEADER ============ -->
    <header class="page-header">
        <a href="home.html" class="back-btn" id="backBtn">
            <i class="fas fa-arrow-left"></i>
        </a>
        <div class="page-title">
            <i class="fas fa-cross"></i>
            Mtakatifu
        </div>
        <div class="header-spacer"></div>
    </header>
    
    <!-- ============ MAIN CONTENT ============ -->
    <main class="main-content" id="mainContent">
        <div class="loading-container">
            <div class="loading-spinner"></div>
            <div class="loading-text">Inapakia...</div>
        </div>
    </main>
    
    <!-- ============ SCRIPTS ============ -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="user-auth.js"></script>
    <script src="dark-mode.js"></script>
    
    <script>
        // ============================================
        // WATAKATIFU PAGE - watakatifu.html
        // ============================================
        
        let currentUser = null;
        let settings = {};
        let saintData = null;
        let saintId = '';
        let comments = [];
        
        document.addEventListener('DOMContentLoaded', async function() {
            console.log('Watakatifu page - Initializing');
            
            // Check user (optional)
            currentUser = getCurrentUser();
            
            // Get URL parameter
            const params = new URLSearchParams(window.location.search);
            saintId = params.get('id');
            
            console.log('Saint ID:', saintId);
            
            if (!saintId) {
                renderError('Mtakatifu haipatikani', 'Link si sahihi');
                return;
            }
            
            // Load settings
            settings = await loadSettings();
            
            // Load saint
            await loadSaint();
            
            // Load comments
            await loadComments();
            
            // Render
            renderSaint();
            
            // Setup events
            setupEvents();
        });
        
        // ============ LOAD SETTINGS ============
        async function loadSettings() {
            try {
                const { data } = await supabaseClient
                    .from('app_settings')
                    .select('setting_key, setting_value');
                
                const obj = {};
                (data || []).forEach(s => {
                    obj[s.setting_key] = s.setting_value;
                });
                
                return obj;
            } catch (e) {
                return {};
            }

        // ============ DOWNLOAD SAINT (Picha + Text) ============
        async function downloadSaint() {
            try {
                showToast('Download inaanza...', 'info');
                
                if (currentUser) {
                    await supabaseClient.from('content_downloads').insert([{
                        user_id: currentUser.id,
                        content_type: 'saint',
                        content_id: saintId
                    }]);
                    await loadCounts();
                }
                
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                
                canvas.width = 1080;
                canvas.height = 1920;
                
                ctx.fillStyle = '#020617';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.fillStyle = '#0f172a';
                roundRect(ctx, 40, 40, canvas.width - 80, canvas.height - 80, 30);
                ctx.fill();
                
                ctx.strokeStyle = '#d4af37';
                ctx.lineWidth = 3;
                roundRect(ctx, 40, 40, canvas.width - 80, canvas.height - 80, 30);
                ctx.stroke();
                
                let yPos = 100;
                
                if (saintData.picha_file) {
                    try {
                        const img = await loadImage(saintData.picha_file);
                        
                        const imgMaxWidth = 500;
                        const imgMaxHeight = 500;
                        
                        let imgWidth = img.width;
                        let imgHeight = img.height;
                        
                        if (imgWidth > imgMaxWidth) {
                            imgHeight = (imgHeight * imgMaxWidth) / imgWidth;
                            imgWidth = imgMaxWidth;
                        }
                        if (imgHeight > imgMaxHeight) {
                            imgWidth = (imgWidth * imgMaxHeight) / imgHeight;
                            imgHeight = imgMaxHeight;
                        }
                        
                        const imgX = (canvas.width - imgWidth) / 2;
                        
                        ctx.drawImage(img, imgX, yPos, imgWidth, imgHeight);
                        
                        yPos += imgHeight + 40;
                    } catch (e) {
                        console.warn('Image load failed:', e);
                    }
                }
                
                ctx.fillStyle = '#d4af37';
                ctx.font = 'bold 56px -apple-system, sans-serif';
                ctx.textAlign = 'center';
                wrapText(ctx, saintData.jina, canvas.width / 2, yPos, canvas.width - 160, 66);
                yPos += 100;
                
                if (saintData.sikukuu) {
                    const dateFormatted = new Date(saintData.sikukuu).toLocaleDateString('sw-TZ', {
                        day: 'numeric',
                        month: 'long',
                        year: 'numeric'
                    });
                    ctx.fillStyle = '#94a3b8';
                    ctx.font = '32px -apple-system, sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText('📅 ' + dateFormatted, canvas.width / 2, yPos);
                    yPos += 60;
                }
                
                if (saintData.historia) {
                    yPos += 20;
                    ctx.fillStyle = '#d4af37';
                    ctx.font = 'bold 32px -apple-system, sans-serif';
                    ctx.textAlign = 'left';
                    ctx.fillText('HISTORIA', 80, yPos);
                    yPos += 50;
                    
                    ctx.fillStyle = '#f8fafc';
                    ctx.font = '26px -apple-system, sans-serif';
                    wrapText(ctx, saintData.historia, 80, yPos, canvas.width - 160, 38);
                    yPos += Math.ceil(saintData.historia.length / 40) * 38 + 40;
                }
                
                if (saintData.sala) {
                    yPos += 20;
                    ctx.fillStyle = '#3b82f6';
                    ctx.font = 'bold 32px -apple-system, sans-serif';
                    ctx.textAlign = 'left';
                    ctx.fillText('SALA', 80, yPos);
                    yPos += 50;
                    
                    ctx.fillStyle = '#f8fafc';
                    ctx.font = 'italic 26px -apple-system, sans-serif';
                    wrapText(ctx, saintData.sala, 80, yPos, canvas.width - 160, 38);
                    yPos += Math.ceil(saintData.sala.length / 40) * 38 + 40;
                }
                
                ctx.fillStyle = 'rgba(212, 175, 55, 0.8)';
                ctx.font = 'bold 28px -apple-system, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('Kwaya ya Mtakatifu Carlo Acutis', canvas.width / 2, canvas.height - 100);
                ctx.font = 'bold 36px -apple-system, sans-serif';
                ctx.fillStyle = '#d4af37';
                ctx.fillText('KMCA', canvas.width / 2, canvas.height - 55);
                
                canvas.toBlob(function(blob) {
                    const blobUrl = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = blobUrl;
                    link.download = `Mtakatifu-${saintData.jina.replace(/\s+/g, '-')}.png`;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    URL.revokeObjectURL(blobUrl);
                    
                    showToast('Download imekamilika!', 'success');
                }, 'image/png');
                
            } catch (e) {
                console.error('Download error:', e);
                showToast('Imeshindikana ku-download', 'error');
            }
        }
        
        // ============ CANVAS HELPERS ============
        function loadImage(url) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.crossOrigin = 'anonymous';
                img.onload = () => resolve(img);
                img.onerror = reject;
                img.src = url;
            });
        }
        
        function roundRect(ctx, x, y, width, height, radius) {
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.lineTo(x + width - radius, y);
            ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
            ctx.lineTo(x + width, y + height - radius);
            ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
            ctx.lineTo(x + radius, y + height);
            ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
            ctx.lineTo(x, y + radius);
            ctx.quadraticCurveTo(x, y, x + radius, y);
            ctx.closePath();
        }
        
        function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
            const paragraphs = text.split('\n');
            let currentY = y;
            
            paragraphs.forEach(paragraph => {
                const words = paragraph.split(' ');
                let line = '';
                
                words.forEach(word => {
                    const testLine = line + word + ' ';
                    const metrics = ctx.measureText(testLine);
                    
                    if (metrics.width > maxWidth && line !== '') {
                        ctx.fillText(line, x, currentY);
                        line = word + ' ';
                        currentY += lineHeight;
                    } else {
                        line = testLine;
                    }
                });
                
                ctx.fillText(line, x, currentY);
                currentY += lineHeight;
            });
            
            return currentY;
        }
        
        // ============ RENDER ERROR ============
        function renderError(title, message) {
            const main = document.getElementById('mainContent');
            main.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-cross"></i>
                    <h3>${title}</h3>
                    <p>${message}</p>
                    <button class="btn-home" onclick="window.location.href='home.html'">
                        <i class="fas fa-home"></i>
                        Rudi Home
                    </button>
                </div>
            `;
        }
        
        // ============ HELPERS ============
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function generateInitials(jina) {
            if (!jina) return '??';
            const cleaned = jina.trim().replace(/\s+/g, ' ');
            const names = cleaned.split(' ');
            
            if (names.length >= 2) {
                return (names[0].charAt(0) + names[1].charAt(0)).toUpperCase();
            }
            if (names.length === 1 && names[0].length >= 2) {
                return names[0].substring(0, 2).toUpperCase();
            }
            return '??';
        }
        
        function getTimeAgo(dateString) {
            if (!dateString) return '';
            const date = new Date(dateString);
            const now = new Date();
            const seconds = Math.floor((now - date) / 1000);
            
            if (seconds < 60) return 'Sasa hivi';
            if (seconds < 3600) return Math.floor(seconds / 60) + 'm';
            if (seconds < 86400) return Math.floor(seconds / 3600) + 'h';
            if (seconds < 604800) return Math.floor(seconds / 86400) + 'd';
            
            return date.toLocaleDateString('sw-TZ', { day: 'numeric', month: 'short' });
        }
    </script>
</body>
