<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#020617">
    <title>KMCA - Share</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="user-icon-180.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="KMCA">
    <link rel="icon" href="favicon.ico">
    
    <style>
        :root {
            --primary: #d4af37;
            --primary-dark: #b8962e;
            --primary-light: #f0d060;
            --bg-dark: #020617;
            --bg-card: #0f172a;
            --bg-input: #1e293b;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --error: #ef4444;
            --success: #10b981;
            --warning: #f59e0b;
            --info: #3b82f6;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --shadow: 0 4px 20px rgba(0,0,0,0.2);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="light"] {
            --bg-dark: #f8fafc;
            --bg-card: #ffffff;
            --bg-input: #f1f5f9;
            --text-light: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            overflow-x: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-dark);
            color: var(--text-light);
            line-height: 1.6;
            min-height: 100vh;
            padding-bottom: 40px;
            transition: background 0.3s, color 0.3s;
        }

        /* ============ HEADER ============ */
        .share-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 64px;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 20px;
            z-index: 100;
            box-shadow: var(--shadow);
        }

        .share-header-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 20px;
            font-weight: 900;
            color: var(--primary);
            letter-spacing: 1px;
        }

        .share-header-logo i {
            font-size: 24px;
        }

        /* ============ MAIN CONTENT ============ */
        .share-main {
            max-width: 600px;
            margin: 0 auto;
            padding: 84px 12px 20px;
        }

        /* ============ CTA BANNER (Juu) ============ */
        .cta-banner-top {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.15), rgba(212, 175, 55, 0.05));
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: var(--radius-lg);
            padding: 16px 20px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            cursor: pointer;
            transition: var(--transition);
            animation: slideDown 0.5s ease-out;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .cta-banner-top:hover {
            transform: translateY(-2px);
            border-color: var(--primary);
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.25);
        }

        .cta-banner-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: var(--bg-dark);
            flex-shrink: 0;
            animation: pulseIcon 2s ease-in-out infinite;
        }

        @keyframes pulseIcon {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        .cta-banner-content {
            flex: 1;
        }

        .cta-banner-content h4 {
            font-size: 15px;
            font-weight: 800;
            color: var(--text-light);
            margin-bottom: 2px;
        }

        .cta-banner-content p {
            font-size: 12px;
            color: var(--text-muted);
        }

        .cta-banner-arrow {
            color: var(--primary);
            font-size: 18px;
            flex-shrink: 0;
        }

        /* ============ CONTENT CARD ============ */
        .content-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            overflow: hidden;
            animation: slideUp 0.5s ease-out;
            margin-bottom: 16px;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ============ CONTENT HEADER ============ */
        .content-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px;
        }

        .content-owner-logo {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: var(--bg-dark);
            flex-shrink: 0;
            overflow: hidden;
        }

        .content-owner-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .content-owner-info {
            flex: 1;
        }

        .content-owner-name {
            font-size: 15px;
            font-weight: 800;
            color: var(--text-light);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .verified-badge {
            color: var(--primary);
            font-size: 14px;
        }

        .content-owner-time {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* ============ CONTENT BODY ============ */
        .content-body {
            padding: 0 16px 16px;
        }

        .content-title {
            font-size: 22px;
            font-weight: 900;
            color: var(--text-light);
            margin-bottom: 10px;
            letter-spacing: -0.5px;
            line-height: 1.3;
        }

        .content-subtitle {
            font-size: 14px;
            color: var(--primary);
            font-weight: 700;
            font-style: italic;
            margin-bottom: 14px;
        }

        .content-text {
            font-size: 15px;
            color: var(--text-light);
            line-height: 1.8;
            white-space: pre-wrap;
            word-wrap: break-word;
            overflow-wrap: break-word;
            margin-bottom: 16px;
        }

        /* ============ CONTENT MEDIA ============ */
        .content-media {
            position: relative;
            background: var(--bg-input);
            overflow: hidden;
            margin-bottom: 16px;
            border-radius: var(--radius-md);
        }

        .content-media img {
            width: 100%;
            display: block;
            max-height: 600px;
            object-fit: contain;
        }

        .content-media video,
        .content-media audio {
            width: 100%;
            display: block;
        }

        .content-media audio {
            padding: 12px;
        }

        /* ============ WATERMARK ============ */
        .watermark {
            position: absolute;
            bottom: 16px;
            right: 16px;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(10px);
            padding: 8px 14px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            pointer-events: none;
            z-index: 5;
            max-width: 220px;
        }

        .watermark-logo {
            width: 32px;
            height: 32px;
            object-fit: contain;
            flex-shrink: 0;
        }

        .watermark-text {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
        }

        .watermark-text span:first-child {
            font-size: 9px;
            color: #f0d060;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            letter-spacing: 0.3px;
            line-height: 1.2;
        }

        .watermark-text span:last-child {
            font-size: 12px;
            color: #d4af37;
            font-weight: 900;
            letter-spacing: 1.5px;
            line-height: 1.2;
        }

        /* ============ CONTENT ACTIONS ============ */
        .content-actions {
            display: flex;
            border-top: 1px solid var(--border);
        }

        .content-action {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            transition: var(--transition);
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
        }

        .content-action:hover {
            background: var(--bg-input);
            color: var(--text-light);
        }

        .content-action.liked {
            color: var(--error);
        }

        .content-action.liked i {
            animation: heartBeat 0.5s;
        }

        @keyframes heartBeat {
            0%, 100% { transform: scale(1); }
            25% { transform: scale(1.3); }
            50% { transform: scale(1); }
            75% { transform: scale(1.2); }
        }

        /* ============ CTA BANNER (Chini) ============ */
        .cta-banner-bottom {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.15), rgba(212, 175, 55, 0.05));
            border: 2px solid var(--primary);
            border-radius: var(--radius-lg);
            padding: 24px 20px;
            text-align: center;
            animation: slideUp 0.5s ease-out 0.2s both;
        }

        .cta-banner-bottom-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .cta-banner-bottom h3 {
            font-size: 20px;
            font-weight: 900;
            color: var(--text-light);
            margin-bottom: 8px;
        }

        .cta-banner-bottom p {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .btn-install-app {
            width: 100%;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: var(--bg-dark);
            border: none;
            border-radius: var(--radius-md);
            padding: 16px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-family: inherit;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-install-app:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(212, 175, 55, 0.5);
        }

        /* ============ COMMENTS SECTION ============ */
        .comments-section {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 20px;
            margin-top: 16px;
            animation: slideUp 0.5s ease-out 0.3s both;
        }

        .comments-section h3 {
            font-size: 16px;
            font-weight: 800;
            color: var(--text-light);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .comments-section h3 i {
            color: var(--primary);
        }

        .comments-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 16px;
            max-height: 400px;
            overflow-y: auto;
        }

        .comment-item {
            display: flex;
            gap: 12px;
            animation: slideUp 0.3s ease-out;
        }

        .comment-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 800;
            color: var(--bg-dark);
            flex-shrink: 0;
            overflow: hidden;
        }

        .comment-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .comment-body {
            flex: 1;
            min-width: 0;
        }

        .comment-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 4px;
        }

        .comment-author {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-light);
        }

        .comment-time {
            font-size: 11px;
            color: var(--text-muted);
        }

        .comment-text {
            font-size: 14px;
            color: var(--text-light);
            line-height: 1.5;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .no-comments {
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
            font-size: 13px;
        }

        .comment-input-container {
            display: flex;
            gap: 10px;
        }

        .comment-input {
            flex: 1;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 12px 16px;
            color: var(--text-light);
            font-size: 14px;
            outline: none;
            font-family: inherit;
            transition: var(--transition);
        }

        .comment-input:focus {
            border-color: var(--primary);
        }

        .btn-send-comment {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: var(--bg-dark);
            border: none;
            border-radius: var(--radius-md);
            padding: 12px 18px;
            font-size: 16px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-send-comment:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(212, 175, 55, 0.4);
        }

        .btn-send-comment:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* ============ LOGIN PROMPT (Kama hajasajiliwa) ============ */
        .login-prompt {
            background: var(--bg-input);
            border: 1px dashed var(--border);
            border-radius: var(--radius-md);
            padding: 20px;
            text-align: center;
        }

        .login-prompt i {
            font-size: 32px;
            color: var(--primary);
            margin-bottom: 10px;
        }

        .login-prompt p {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 14px;
        }

        .btn-login-prompt {
            background: var(--primary);
            color: var(--bg-dark);
            border: none;
            border-radius: var(--radius-md);
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            font-family: inherit;
        }

        .btn-login-prompt:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(212, 175, 55, 0.4);
        }

        /* ============ EMPTY/ERROR STATE ============ */
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-muted);
        }

        .empty-state i {
            font-size: 72px;
            color: var(--border);
            margin-bottom: 20px;
        }

        .empty-state h3 {
            font-size: 20px;
            font-weight: 800;
            color: var(--text-light);
            margin-bottom: 10px;
        }

        .empty-state p {
            font-size: 14px;
            margin-bottom: 20px;
        }

        /* ============ LOADING ============ */
        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 80px 20px;
            gap: 16px;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--bg-input);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            color: var(--text-muted);
            font-size: 14px;
        }

        /* ============ LOADING OVERLAY ============ */
        .loading-overlay {
            position: fixed;
            inset: 0;
            background: rgba(2, 6, 23, 0.95);
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 20px;
            backdrop-filter: blur(10px);
        }

        .loading-overlay.active {
            display: flex;
        }

        .loading-overlay .loading-spinner {
            width: 50px;
            height: 50px;
        }

        .loading-overlay-text {
            color: white;
            font-size: 14px;
            font-weight: 600;
        }

        /* ============ TOAST ============ */
        .kmca-toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: var(--success);
            color: white;
            padding: 14px 24px;
            border-radius: var(--radius-md);
            font-size: 14px;
            font-weight: 600;
            z-index: 99999;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 10px;
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            max-width: 90%;
        }

        /* ============ SHARE MODAL ============ */
        .share-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 5000;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            backdrop-filter: blur(5px);
            animation: fadeIn 0.2s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .share-modal-content {
            background: var(--bg-card);
            border-radius: 20px 20px 0 0;
            width: 100%;
            max-width: 500px;
            padding: 24px 20px;
            animation: slideUp 0.3s ease-out;
        }

        .share-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .share-modal-header h3 {
            font-size: 18px;
            font-weight: 800;
            color: var(--text-light);
        }

        .share-modal-close {
            width: 36px;
            height: 36px;
            background: var(--bg-input);
            border: none;
            border-radius: 50%;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 16px;
        }

        .share-options-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .share-option {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding: 16px 8px;
            background: var(--bg-input);
            border-radius: var(--radius-md);
            border: none;
            color: var(--text-light);
            text-decoration: none;
            cursor: pointer;
            transition: var(--transition);
            font-family: inherit;
        }

        .share-option:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        .share-option i { font-size: 28px; }
        .share-option span { font-size: 12px; font-weight: 600; }

        .share-option.whatsapp i { color: #25D366; }
        .share-option.facebook i { color: #1877F2; }
        .share-option.twitter i { color: #1DA1F2; }
        .share-option.telegram i { color: #0088cc; }
        .share-option.copy i { color: var(--primary); }

        .share-url-preview input {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 12px;
            color: var(--text-muted);
            font-size: 12px;
            outline: none;
        }

        /* ============ RESPONSIVE ============ */
        @media (max-width: 480px) {
            .share-main {
                padding: 80px 10px 20px;
            }
            
            .content-title {
                font-size: 18px;
            }
            
            .cta-banner-bottom {
                padding: 20px 16px;
            }
            
            .cta-banner-bottom-icon {
                font-size: 40px;
            }
            
            .cta-banner-bottom h3 {
                font-size: 17px;
            }
        }
    </style>
</head>
<body>
    
    <!-- ============ HEADER ============ -->
    <header class="share-header">
        <div class="share-header-logo">
            <i class="fas fa-church"></i>
            KMCA
        </div>
    </header>
    
    <!-- ============ MAIN CONTENT ============ -->
    <main class="share-main" id="shareMain">
        <div class="loading-container">
            <div class="loading-spinner"></div>
            <div class="loading-text">Inapakia...</div>
        </div>
    </main>
    
    <!-- ============ LOADING OVERLAY ============ -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
        <div class="loading-overlay-text" id="loadingOverlayText">Inapakia...</div>
    </div>
    
    <!-- ============ SCRIPTS ============ -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="user-auth.js"></script>
    <script src="dark-mode.js"></script>
    
    <script>
        // ============================================
        // SHARE PAGE - share.html
        // ============================================
        
        let currentUser = null;
        let settings = {};
        let contentType = '';
        let contentId = '';
        let contentData = null;
        let comments = [];
        
        document.addEventListener('DOMContentLoaded', async function() {
            console.log('Share page - Initializing');
            
            // Check user (optional - share inaonekana kwa wote)
            currentUser = getCurrentUser();
            console.log('Current user:', currentUser ? currentUser.jina : 'Guest');
            
            // Get URL parameters
            const params = new URLSearchParams(window.location.search);
            contentType = params.get('type');
            contentId = params.get('id');
            
            console.log('Content type:', contentType);
            console.log('Content ID:', contentId);
            
            if (!contentType || !contentId) {
                renderError('Link si sahihi', 'Content haipatikani');
                return;
            }
            
            // Load settings
            settings = await loadSettings();
            
            // Load content
            await loadContent();
            
            // Load comments
            await loadComments();
            
            // Render share page
            renderSharePage();
        });
        
        // ============ LOAD SETTINGS ============
        async function loadSettings() {
            try {
                const { data } = await supabaseClient
                    .from('app_settings')
                    .select('setting_key, setting_value');
                
                const settingsObj = {};
                (data || []).forEach(s => {
                    settingsObj[s.setting_key] = s.setting_value;
                });
                
                return settingsObj;
            } catch (e) {
                return {};
            }
        }
        
        // ============ LOAD CONTENT ============
        async function loadContent() {
            try {
                let table = '';
                
                // Map type to table
                const typeMap = {
                    'post': 'posts',
                    'saint': 'watakatifu',
                    'bible': 'bible_verses',
                    'song': 'nyimbo_za_siku',
                    'masomo': 'masomo_dominica',
                    'event': 'matukio',
                    'poll': 'polls'
                };
                
                table = typeMap[contentType];
                
                if (!table) {
                    renderError('Content type haijulikani', 'Link si sahihi');
                    return;
                }
                
                // Query content
                let query = supabaseClient.from(table).select('*').eq('id', contentId);
                
                // Kama ni poll, ongeza options
                if (contentType === 'poll') {
                    query = supabaseClient
                        .from('polls')
                        .select('*, poll_options(*)')
                        .eq('id', contentId);
                }
                
                const { data, error } = await query.single();
                
                if (error || !data) {
                    renderError('Content haipatikani', 'Huenda imefutwa au link si sahihi');
                    return;
                }
                
                contentData = data;
                console.log('Content loaded:', data);
                
            } catch (e) {
                console.error('Load content error:', e);
                renderError('Imeshindikana', 'Tafadhali jaribu tena');
            }
        }
        
        // ============ LOAD COMMENTS ============
        async function loadComments() {
            try {
                const { data } = await supabaseClient
                    .from('comments')
                    .select('*, users(jina, profile_picture)')
                    .eq('content_type', contentType)
                    .eq('content_id', contentId)
                    .order('created_at', { ascending: false })
                    .limit(50);
                
                comments = data || [];
            } catch (e) {
                console.log('No comments');
                comments = [];
            }
        }

        // ============ RENDER POST MEDIA ============
        function renderPostMedia() {
            const type = contentData.type || '';
            const mediaFiles = contentData.media_files || [];
            
            if (type === 'maneno' || mediaFiles.length === 0) {
                return '';
            }
            
            if (type === 'picha_moja' && mediaFiles[0]) {
                return `
                    <div class="content-media">
                        <img src="${mediaFiles[0]}" alt="Post">
                        ${renderWatermark()}
                    </div>
                `;
            }
            
            if (type === 'picha_nyingi') {
                return `
                    <div class="content-media">
                        <img src="${mediaFiles[0]}" alt="Post">
                        ${renderWatermark()}
                    </div>
                `;
            }
            
            if (type === 'video' && mediaFiles[0]) {
                return `
                    <div class="content-media">
                        <video src="${mediaFiles[0]}" controls playsinline></video>
                        ${renderWatermark()}
                    </div>
                `;
            }
            
            if (type === 'live_video' || type === 'auto_fake_live_video') {
                return `
                    <div class="content-media">
                        <video src="${mediaFiles[0]}" controls playsinline></video>
                        ${renderWatermark()}
                    </div>
                `;
            }
            
            if ((type === 'picha_music' || type === 'picha_nyingi_music') && mediaFiles[0]) {
                let html = `
                    <div class="content-media">
                        <img src="${mediaFiles[0]}" alt="Post">

                    html += `

                return html;
            }
            
            return `

        // ============ RENDER COMMENTS LIST ============
        function renderCommentsList() {
            if (comments.length === 0) {

            }
            
            return comments.map(comment => {
                const user = comment.users || {};
                const initials = generateInitials(user.jina);
                
                const avatarHtml = user.profile_picture
                    ? `<img src="${user.profile_picture}" alt="${user.jina}">`
                    : initials;
                
                return `
                    <div class="comment-item">
                        <div class="comment-avatar">${avatarHtml}</div>
                        <div class="comment-body">
                            <div class="comment-header">
                                <span class="comment-author">${escapeHtml(user.jina || 'Mtumiaji')}</span>
                                <span class="comment-time">${getTimeAgo(comment.created_at)}</span>
                            </div>
                            <div class="comment-text">${escapeHtml(comment.content)}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        // ============ SETUP EVENTS ============
        function setupEvents() {
            // Like button
            const likeBtn = document.querySelector('.share-like-btn');
            if (likeBtn) {
                likeBtn.addEventListener('click', async function() {
                    if (!currentUser) {
                        showToast('Ingia ili ku-like', 'warning');
                        setTimeout(() => openApp(), 1000);
                        return;
                    }
                    await toggleLike(this);
                });
            }
            
            // Comment button
            const commentBtn = document.querySelector('.share-comment-btn');
            if (commentBtn) {
                commentBtn.addEventListener('click', function() {
                    document.getElementById('commentInput')?.focus();
                });
            }
            
            // Share button
            const shareBtn = document.querySelector('.share-share-btn');
            if (shareBtn) {
                shareBtn.addEventListener('click', async function() {
                    const title = this.getAttribute('data-title');
                    await shareContent(title);
                });
            }
            
            // Download button
            const downloadBtn = document.querySelector('.share-download-btn');
            if (downloadBtn) {
                downloadBtn.addEventListener('click', async function() {
                    const url = this.getAttribute('data-url');
                    await downloadContent(url);
                });
            }
            
            // Send comment
            const sendCommentBtn = document.getElementById('sendCommentBtn');
            if (sendCommentBtn) {
                sendCommentBtn.addEventListener('click', async function() {
                    await sendComment();
                });
            }
            
            // Comment input Enter
            const commentInput = document.getElementById('commentInput');
            if (commentInput) {
                commentInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        sendComment();
                    }
                });
            }
            
            // Poll options
            document.querySelectorAll('.poll-option').forEach(option => {
                option.addEventListener('click', async function() {
                    if (!currentUser) {
                        showToast('Ingia ili kupiga kura', 'warning');
                        setTimeout(() => openApp(), 1000);
                        return;
                    }
                    await votePoll(this);
                });
            });
            
            // Load counts
            loadCounts();
            
            // Load poll results (kama ni poll)
            if (contentType === 'poll') {
                loadPollResults();
            }
        }
        
        // ============ LOAD COUNTS ============
        async function loadCounts() {
            try {
                // Like count
                const { count: likeCount } = await supabaseClient
                    .from('content_likes')
                    .select('*', { count: 'exact', head: true })
                    .eq('content_type', contentType)
                    .eq('content_id', contentId);
                
                const likeEl = document.querySelector('.like-count');
                if (likeEl) likeEl.textContent = likeCount || 0;
                
                // Share count
                const { count: shareCount } = await supabaseClient
                    .from('content_shares')
                    .select('*', { count: 'exact', head: true })
                    .eq('content_type', contentType)
                    .eq('content_id', contentId);
                
                const shareEl = document.querySelector('.share-count');
                if (shareEl) shareEl.textContent = shareCount || 0;
                
                // Download count
                const { count: downloadCount } = await supabaseClient
                    .from('content_downloads')
                    .select('*', { count: 'exact', head: true })
                    .eq('content_type', contentType)
                    .eq('content_id', contentId);
                
                const downloadEl = document.querySelector('.download-count');
                if (downloadEl) downloadEl.textContent = downloadCount || 0;
                
            } catch (e) {
                console.log('Load counts error:', e);
            }
        }
        
        // ============ LOAD USER LIKE ============
        async function loadUserLike() {
            try {
                const { data } = await supabaseClient
                    .from('content_likes')
                    .select('id')
                    .eq('user_id', currentUser.id)
                    .eq('content_type', contentType)
                    .eq('content_id', contentId)
                    .maybeSingle();
                
                if (data) {
                    const likeBtn = document.querySelector('.share-like-btn');
                    if (likeBtn) {
                        likeBtn.classList.add('liked');
                        likeBtn.querySelector('i').className = 'fas fa-heart';
                    }
                }
            } catch (e) {}
        }
        
        // ============ TOGGLE LIKE ============
        async function toggleLike(btn) {
            try {
                const { data: existing } = await supabaseClient
                    .from('content_likes')
                    .select('id')
                    .eq('user_id', currentUser.id)
                    .eq('content_type', contentType)
                    .eq('content_id', contentId)
                    .maybeSingle();
                
                if (existing) {
                    await supabaseClient.from('content_likes').delete().eq('id', existing.id);
                    btn.classList.remove('liked');
                    btn.querySelector('i').className = 'far fa-heart';
                } else {
                    await supabaseClient.from('content_likes').insert([{
                        user_id: currentUser.id,
                        content_type: contentType,
                        content_id: contentId
                    }]);
                    btn.classList.add('liked');
                    btn.querySelector('i').className = 'fas fa-heart';
                }
                
                await loadCounts();
            } catch (e) {
                console.error('Toggle like error:', e);
            }
        }
        
        // ============ SEND COMMENT ============
        async function sendComment() {
            if (!currentUser) return;
            
            const input = document.getElementById('commentInput');
            const content = input.value.trim();
            
            if (!content) return;
            
            const btn = document.getElementById('sendCommentBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
            
            try {
                await supabaseClient.from('comments').insert([{
                    user_id: currentUser.id,
                    content_type: contentType,
                    content_id: contentId,
                    post_id: contentType === 'post' ? contentId : null,
                    content: content
                }]);
                
                input.value = '';
                
                // Reload comments
                await loadComments();
                
                // Update UI
                const commentsList = document.getElementById('commentsList');
                if (commentsList) {
                    commentsList.innerHTML = renderCommentsList();
                }
                
                const commentCountEl = document.querySelector('.comment-count');
                if (commentCountEl) commentCountEl.textContent = comments.length;
                
                showToast('Comment imetumwa!', 'success');
                
            } catch (e) {
                console.error('Send comment error:', e);
                showToast('Imeshindikana kutuma', 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-paper-plane"></i>';
            }
        }
        
        // ============ SHARE CONTENT ============
        async function shareContent(title) {
            try {
                const baseUrl = settings.share_link || window.location.origin;
                const pagePath = settings.share_page_path || '/share.html';
                const shareUrl = `${baseUrl}${pagePath}?type=${contentType}&id=${contentId}`;
                
                // Log share (kama amesajiliwa)
                if (currentUser) {
                    await supabaseClient.from('content_shares').insert([{
                        user_id: currentUser.id,
                        content_type: contentType,
                        content_id: contentId
                    }]);
                    
                    await loadCounts();
                }
                
                // Show share options
                showShareOptions(shareUrl, title);
                
            } catch (e) {
                console.error('Share error:', e);
                showToast('Imeshindikana', 'error');
            }
        }
        
        // ============ SHOW SHARE OPTIONS ============
        function showShareOptions(shareUrl, title) {
            const existing = document.getElementById('shareOptionsModal');
            if (existing) existing.remove();
            
            const modal = document.createElement('div');
            modal.id = 'shareOptionsModal';
            modal.className = 'share-modal';
            modal.innerHTML = `
                <div class="share-modal-content">
                    <div class="share-modal-header">
                        <h3>Share kwa</h3>
                        <button class="share-modal-close" onclick="document.getElementById('shareOptionsModal').remove()">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                    
                    <div class="share-options-grid">
                        <a href="https://wa.me/?text=${encodeURIComponent(title + ' - ' + shareUrl)}" target="_blank" class="share-option whatsapp">
                            <i class="fab fa-whatsapp"></i>
                            <span>WhatsApp</span>
                        </a>
                        
                        <a href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(shareUrl)}" target="_blank" class="share-option facebook">
                            <i class="fab fa-facebook"></i>
                            <span>Facebook</span>
                        </a>
                        
                        <a href="https://twitter.com/intent/tweet?text=${encodeURIComponent(title)}&url=${encodeURIComponent(shareUrl)}" target="_blank" class="share-option twitter">
                            <i class="fab fa-twitter"></i>
                            <span>Twitter</span>
                        </a>
                        
                        <a href="https://t.me/share/url?url=${encodeURIComponent(shareUrl)}&text=${encodeURIComponent(title)}" target="_blank" class="share-option telegram">
                            <i class="fab fa-telegram"></i>
                            <span>Telegram</span>
                        </a>
                        
                        <button class="share-option copy" onclick="copyShareLink('${shareUrl}')">
                            <i class="fas fa-link"></i>
                            <span>Copy Link</span>
                        </button>
                    </div>
                    
                    <div class="share-url-preview">
                        <input type="text" value="${shareUrl}" readonly onclick="this.select()">
                    </div>
                </div>
            `;
            
            document.body.appendChild(modal);
            
            modal.addEventListener('click', function(e) {
                if (e.target === modal) modal.remove();
            });
        }
        
        // ============ COPY SHARE LINK ============
        async function copyShareLink(url) {
            try {
                await navigator.clipboard.writeText(url);
                showToast('Link imecopywa!', 'success');
                document.getElementById('shareOptionsModal')?.remove();
            } catch (e) {
                const input = document.createElement('input');
                input.value = url;
                document.body.appendChild(input);
                input.select();
                document.execCommand('copy');
                document.body.removeChild(input);
                showToast('Link imecopywa!', 'success');
            }
        }
        
        // ============ DOWNLOAD CONTENT ============
        async function downloadContent(url) {
            if (!url) {
                showToast('Hakuna file ya download', 'warning');
                return;
            }
            
            try {
                showToast('Download inaanza...', 'info');
                
                // Log download (kama amesajiliwa)
                if (currentUser) {
                    await supabaseClient.from('content_downloads').insert([{
                        user_id: currentUser.id,
                        content_type: contentType,
                        content_id: contentId
                    }]);
                    
                    await loadCounts();
                }
                
                const response = await fetch(url);
                const blob = await response.blob();
                const blobUrl = URL.createObjectURL(blob);
                
                const link = document.createElement('a');
                link.href = blobUrl;
                link.download = `KMCA-${contentType}-${Date.now()}`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                
                setTimeout(() => URL.revokeObjectURL(blobUrl), 1000);
                
                showToast('Download imekamilika!', 'success');
                
            } catch (e) {
                console.error('Download error:', e);
                showToast('Imeshindikana ku-download', 'error');
            }
        }
        
        // ============ VOTE POLL ============
        async function votePoll(option) {
            if (!currentUser) return;
            
            const optionId = option.getAttribute('data-option-id');
            
            // Check kama ameshavote
            const { data: existing } = await supabaseClient
                .from('poll_votes')
                .select('id')
                .eq('user_id', currentUser.id)
                .eq('poll_id', contentId)
                .maybeSingle();
            
            if (existing) {
                showToast('Umeshapiga kura', 'warning');
                return;
            }
            
            try {
                await supabaseClient.from('poll_votes').insert([{
                    user_id: currentUser.id,
                    poll_id: contentId,
                    option_id: optionId
                }]);
                
                option.style.borderColor = 'var(--primary)';
                option.style.background = 'rgba(212, 175, 55, 0.1)';
                
                await loadPollResults();
                showToast('Kura yako imepokelewa!', 'success');
                
            } catch (e) {
                console.error('Vote error:', e);
                showToast('Imeshindikana', 'error');
            }
        }
        
        // ============ LOAD POLL RESULTS ============
        async function loadPollResults() {
            try {
                const { data: votes } = await supabaseClient
                    .from('poll_votes')
                    .select('option_id')
                    .eq('poll_id', contentId);
                
                const voteCounts = {};
                (votes || []).forEach(v => {
                    voteCounts[v.option_id] = (voteCounts[v.option_id] || 0) + 1;
                });
                
                const totalVotes = votes ? votes.length : 0;
                
                document.querySelectorAll('.poll-option').forEach(opt => {
                    const optionId = opt.getAttribute('data-option-id');
                    const count = voteCounts[optionId] || 0;
                    const percent = totalVotes > 0 ? Math.round((count / totalVotes) * 100) : 0;
                    
                    const percentEl = opt.querySelector('.poll-percent');
                    if (percentEl) {
                        percentEl.style.display = 'block';
                        percentEl.textContent = `${percent}%`;
                    }
                    
                    // Add background bar
                    let bar = opt.querySelector('.poll-bar');
                    if (!bar) {
                        bar = document.createElement('div');
                        bar.className = 'poll-bar';
                        bar.style.cssText = 'position: absolute; top: 0; left: 0; bottom: 0; background: rgba(212, 175, 55, 0.15); transition: width 0.5s; z-index: 0;';
                        opt.insertBefore(bar, opt.firstChild);
                    }
                    bar.style.width = percent + '%';
                });
            } catch (e) {
                console.log('Load poll results error:', e);
            }
        }
        
        // ============ GET CONTENT TITLE ============
        function getContentTitle() {
            if (!contentData) return 'KMCA';
            
            const titles = {
                'post': contentData.title || contentData.description?.substring(0, 50) || 'Post',
                'saint': contentData.jina || 'Mtakatifu',
                'bible': contentData.kichwa || 'Bible Verse',
                'song': contentData.jina || 'Wimbo',
                'masomo': contentData.jina_dominika || 'Masomo',
                'event': contentData.jina || 'Tukio',
                'poll': contentData.swali || 'Poll'
            };
            
            return titles[contentType] || 'KMCA';
        }
        
        // ============ GET DOWNLOAD URL ============
        function getDownloadUrl() {
            if (!contentData) return '';
            
            if (contentType === 'post' || contentType === 'event') {
                return contentData.media_files?.[0] || contentData.picha_file || '';
            }
            if (contentType === 'saint') {
                return contentData.picha_file || '';
            }
            if (contentType === 'song') {
                return contentData.media_file || '';
            }
            return '';
        }
        
        // ============ OPEN APP ============
        function openApp() {
            // Redirect to index
            window.location.href = 'index.html';
        }
        
        // ============ RENDER ERROR ============
        function renderError(title, message) {
            const main = document.getElementById('shareMain');
            main.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-exclamation-triangle"></i>
                    <h3>${title}</h3>
                    <p>${message}</p>
                    <button class="btn-install-app" onclick="openApp()" style="max-width: 280px; margin: 0 auto;">
                        <i class="fas fa-download"></i>
                        Download KMCA App
                    </button>
                </div>
            `;
        }
        
        // ============ HELPERS ============
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function escapeAttr(text) {
            if (!text) return '';
            return text.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }
        
        function generateInitials(jina) {
            if (!jina) return '??';
            const cleaned = jina.trim().replace(/\s+/g, ' ');
            const names = cleaned.split(' ');
            
            if (names.length >= 2) {
                return (names[0].charAt(0) + names[1].charAt(0)).toUpperCase();
            }
            if (names.length === 1 && names[0].length >= 2) {
                return names[0].substring(0, 2).toUpperCase();
            }
            return '??';
        }
        
        function getTimeAgo(dateString) {
            if (!dateString) return '';
            const date = new Date(dateString);
            const now = new Date();
            const seconds = Math.floor((now - date) / 1000);
            
            if (seconds < 60) return 'Sasa hivi';
            if (seconds < 3600) return Math.floor(seconds / 60) + 'm';
            if (seconds < 86400) return Math.floor(seconds / 3600) + 'h';
            if (seconds < 604800) return Math.floor(seconds / 86400) + 'd';
            
            return date.toLocaleDateString('sw-TZ', { day: 'numeric', month: 'short' });
        }
    </script>
</body>
